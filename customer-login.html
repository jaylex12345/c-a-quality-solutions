<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login | C&A Quality Solutions LLC</title>
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/.netlify/functions/public-supabase-config"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;padding:28px;width:420px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.1)}
input{width:100%;padding:12px;margin-bottom:12px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#0b2d52;color:#fff;font-weight:bold;cursor:pointer}
.section{margin-top:18px;padding-top:18px;border-top:1px solid #e5e7eb}
.section h3{margin:0 0 10px}
.muted{color:#6b7280;font-size:13px}
</style>
  <meta name="description" content="Official customer login page for C&A Quality Solutions LLC operations and customer support.">
  <link rel="canonical" href="https://caqualitysolutions.com/customer-login.html">
  <meta name="robots" content="noindex, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Customer Login | C&A Quality Solutions LLC">
  <meta property="og:description" content="Official customer login page for C&A Quality Solutions LLC operations and customer support.">
  <meta property="og:url" content="https://caqualitysolutions.com/customer-login.html">
  <meta property="og:image" content="https://caqualitysolutions.com/assets/images/logo.jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Customer Login | C&A Quality Solutions LLC">
  <meta name="twitter:description" content="Official customer login page for C&A Quality Solutions LLC operations and customer support.">
  <meta name="twitter:image" content="https://caqualitysolutions.com/assets/images/logo.jpeg">
  <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpeg">
  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}</style>
</head>
<body>
<h1 class="sr-only">Customer Login</h1>
<div class="card">
<h2>Customer Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg"></p>
<p><a href="booking.html">Need service? Book now</a></p>

<div class="section">
  <h3>Create Account</h3>
  <input id="registerName" placeholder="Full Name">
  <input id="registerPhone" placeholder="Phone Number">
  <input id="registerEmail" type="email" placeholder="Email Address">
  <input id="registerPassword" type="password" placeholder="Password">
  <button onclick="registerCustomer()">Register</button>
  <p class="muted">Forgot password? Contact support if you need account help.</p>
</div>
</div>
<script>
const supabaseUrl = "" + (window.CAQ_SUPABASE_URL || "") + "";
const supabaseKey='sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR';
const supabaseClient=supabase.createClient(supabaseUrl,supabaseKey);

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value.trim();
  const {data,error}=await supabaseClient.from('customers').select('*').eq('email',email).eq('password',password).limit(1);
  if(error||!data||!data.length){document.getElementById('msg').innerText='Invalid login';return;}
  localStorage.setItem('customer_id',data[0].id);
  localStorage.setItem('customer_email',data[0].email||email);
  localStorage.setItem('customer_name',data[0].contact_person||data[0].business_name||'Customer');
  localStorage.setItem('role','customer');
  window.location.href='customer-dashboard.html';
}

async function registerCustomer(){
  const name=document.getElementById('registerName').value.trim();
  const phone=document.getElementById('registerPhone').value.trim();
  const email=document.getElementById('registerEmail').value.trim();
  const password=document.getElementById('registerPassword').value.trim();
  const msg=document.getElementById('msg');

  if(!name||!phone||!email||!password){
    msg.innerText='Fill in all registration fields.';
    return;
  }

  const {data: existing} = await supabaseClient.from('customers').select('id').eq('email', email).limit(1);
  if(existing && existing.length){
    msg.innerText='An account already exists for that email.';
    return;
  }

  const {error} = await supabaseClient.from('customers').insert([{ business_name: name, contact_person: name, phone, email, password }]);
  if(error){
    msg.innerText = error.message;
    return;
  }

  msg.innerText = 'Account created. You can log in now.';
  document.getElementById('registerName').value='';
  document.getElementById('registerPhone').value='';
  document.getElementById('registerEmail').value='';
  document.getElementById('registerPassword').value='';
}
</script>
</body>
</html>
