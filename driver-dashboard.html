<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver Dashboard | C&A Quality Solutions</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <img src="images/logo.jpeg" width="110">
  <h1>C&A Quality Solutions LLC</h1>
  <h2>Driver Dashboard</h2>
</header>

<div class="container">
  <div class="card">
    <h3 id="welcome">Welcome Driver</h3>
    <p>Today's Assigned Deliveries</p>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Tracking</th>
          <th>Customer</th>
          <th>Status</th>
          <th>Update</th>
          <th>Photo</th>
          <th>Save</th>
        </tr>
      </thead>
      <tbody id="deliveryTable">
        <tr><td colspan="6">Loading deliveries...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <button onclick="location.href='track.html'">Track Deliveries</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://ncdozhypelmkvaxsdwwt.supabase.co";
  const supabaseKey = "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR";

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

const driverId = localStorage.getItem("driver_id");
const driverName = localStorage.getItem("driver_name");

if (!driverId) {
  window.location.href = "driver-login.html";
}

document.getElementById("welcome").innerText = "Welcome " + (driverName || "Driver");

async function loadDeliveries() {
  const table = document.getElementById("deliveryTable");

  const { data, error } = await supabaseClient
    .from("deliveries")
    .select("*")
    .eq("driver_id", driverId)
    .order("created_at", { ascending: false });

  if (error) {
    console.log(error);
    table.innerHTML = `<tr><td colspan="6">Error loading deliveries.</td></tr>`;
    return;
  }

  if (!data || data.length === 0) {
    table.innerHTML = `<tr><td colspan="6">No deliveries assigned yet.</td></tr>`;
    return;
  }

  table.innerHTML = "";

  data.forEach(delivery => {
    table.innerHTML += `
      <tr>
        <td>${delivery.tracking_number || ""}</td>
        <td>${delivery.customer_name || ""}</td>
        <td>${delivery.status || ""}</td>
        <td>
          <select id="status-${delivery.id}">
            <option ${delivery.status === "Picked Up" ? "selected" : ""}>Picked Up</option>
            <option ${delivery.status === "In Transit" ? "selected" : ""}>In Transit</option>
            <option ${delivery.status === "Out for Delivery" ? "selected" : ""}>Out for Delivery</option>
            <option ${delivery.status === "Delivered" ? "selected" : ""}>Delivered</option>
          </select>
          <button onclick="updateStatus('${delivery.id}')">Update</button>
        </td>
        <td>
          <input type="file" id="photo-${delivery.id}">
        </td>
        <td>
          <button onclick="uploadProof('${delivery.id}', '${delivery.tracking_number}')">Upload</button>
        </td>
      </tr>
    `;
  });
}

async function updateStatus(deliveryId) {
  const status = document.getElementById("status-" + deliveryId).value;

  const updateData = {
    status: status
  };

  if (status === "Delivered") {
    updateData.delivery_time = new Date().toISOString();
    updateData.driver_notes = "Delivered by driver";
    updateData.completed_by = "C&A Quality Solutions LLC";
  }

  const { error } = await supabaseClient
    .from("deliveries")
    .update(updateData)
    .eq("id", deliveryId);

  if (error) {
    alert("Status update failed.");
    console.log(error);
    return;
  }

  alert("Status updated.");
  loadDeliveries();
}

async function uploadProof(deliveryId, trackingNumber) {
  const fileInput = document.getElementById("photo-" + deliveryId);
  const file = fileInput.files[0];

  if (!file) {
    alert("Choose a proof photo first.");
    return;
  }

  const fileName = `${trackingNumber}-${Date.now()}-${file.name}`;

  const { error: uploadError } = await supabaseClient.storage
    .from("proofs")
    .upload(fileName, file);

  if (uploadError) {
    alert("Photo upload failed.");
    console.log(uploadError);
    return;
  }

  const { data } = supabaseClient.storage
    .from("proofs")
    .getPublicUrl(fileName);

  const photoUrl = data.publicUrl;

  const { error } = await supabaseClient
    .from("deliveries")
    .update({ proof_of_delivery: photoUrl })
    .eq("id", deliveryId);

  if (error) {
    alert("Could not save photo URL.");
    console.log(error);
    return;
  }

  alert("Proof of delivery uploaded.");
  loadDeliveries();
}

function logout() {
  localStorage.removeItem("driver_id");
  localStorage.removeItem("driver_name");
  window.location.href = "driver-login.html";
}

loadDeliveries();
</script>

</body>
</html>
