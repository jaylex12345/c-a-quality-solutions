<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Dashboard | C&A Quality Solutions</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

header{
    background:#0b2d52;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:95%;
    max-width:1200px;
    margin:30px auto;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0b2d52;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

button{
    background:#d9b431;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#b88d19;
}

select,input[type=file]{
    padding:8px;
    width:100%;
}
</style>

</head>

<body>

<header>

<img src="images/logo.jpeg" width="110">

<h1>C&A Quality Solutions LLC</h1>

<h2>Driver Dashboard</h2>

</header>

<div class="container">

<div class="card">

<h3>Welcome Driver</h3>

<p>Today's Assigned Deliveries</p>

</div>

<div class="card">

<table>

<thead>

<tr>

<th>Tracking</th>

<th>Customer</th>

<th>Status</th>

<th>Update</th>

<th>Photo</th>

<th>Save</th>

</tr>

</thead>

<tbody>

<tr>

<td>CAQS-000001</td>

<td>Sample Customer</td>

<td>

<select>

<option>Picked Up</option>

<option>In Transit</option>

<option>Delivered</option>

</select>

</td>

<td>

<button>Update</button>

</td>

<td>

<input type="file">

</td>

<td>

<button>Upload</button>

</td>

</tr>

</tbody>

</table>

</div>

<div class="card">

<button onclick="location.href='track.html'">
Track Deliveries
</button>

<button onclick="logout()">
Logout
</button>

</div>

<script>

function logout(){

localStorage.clear();

window.location="driver-login.html";

}

</script>

</body>
</html>
