<style>

<body>
<div class="header"><h1 class="sr-only">Driver dashboard redirect</h1></div>
<div class="wrap">
	<div class="grid">
		<div class="card"><h3>Driver</h3><div class="value" id="driverName">Driver</div></div>
		<div class="card"><h3>Assigned</h3><div class="value" id="assigned">0</div></div>
		<div class="card"><h3>Completed</h3><div class="value" id="completed">0</div></div>
		<div class="card"><h3>Clock</h3><div class="value" id="clockStatus">Off</div></div>
	</div>

	<div class="card">
		<button class="btn btn2" onclick="sendGPS()">Send GPS</button>
		<button class="btn btn3" onclick="clockIn()">Clock In</button>
		<button class="btn btn4" onclick="clockOut()">Clock Out</button>
		<button class="btn btn3" onclick="breakStart()">Break Start</button>
		<button class="btn btn4" onclick="breakEnd()">Break End</button>
		<button class="btn" onclick="logout()">Logout</button>
	</div>

	<div class="card">
		<h2>Assigned Jobs</h2>
		<table>
			<thead><tr><th>Tracking</th><th>Customer</th><th>Assignment</th><th>Status</th><th>Proof</th><th>Actions</th></tr></thead>
			<tbody id="rows"><tr><td colspan="6">Loading...</td></tr></tbody>
		</table>
	</div>
</div>
<script>
if(!window.supabase || typeof window.supabase.createClient !== "function"){
	console.error("Supabase client library failed to load.");
	alert("Supabase failed to load. Refresh and try again.");
	throw new Error("Supabase library is not available");
}

const supabaseClient = window.supabase.createClient("" + (window.CAQ_SUPABASE_URL || "") + "", "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR");
const driverId = localStorage.getItem("driver_id");
if(!driverId) window.location.href = "driver-login.html";
document.getElementById("driverName").innerText = localStorage.getItem("driver_name") || "Driver";
let activeTimesheetId = null;
let activeBreakStartedAt = null;

function requireSupabaseClient(){
	if(!supabaseClient) throw new Error("Supabase client unavailable");
	return supabaseClient;
}

function logout(){ localStorage.clear(); window.location.href = "driver-login.html"; }

async function loadJobs(){
	const { data, error } = await supabaseClient.from("deliveries").select("*").eq("driver_id", driverId).order("created_at", {ascending:false});
	if(error){ document.getElementById("rows").innerHTML = `<tr><td colspan="6">${error.message}</td></tr>`; return; }
	const jobs = data || [];
	document.getElementById("assigned").innerText = jobs.length;
	document.getElementById("completed").innerText = jobs.filter(j => (j.status||"").toLowerCase()==="delivered").length;
	if(!jobs.length){ document.getElementById("rows").innerHTML = '<tr><td colspan="6">No assigned jobs.</td></tr>'; return; }
	document.getElementById("rows").innerHTML = jobs.map(j => `
		<tr>
			<td>${j.tracking_number||''}</td>
			<td>${j.customer_name||''}</td>
			<td>${j.assignment_status||'Assigned'}</td>
			<td>
				<select id="status_${j.id}">
					<option ${j.status==='Picked Up'?'selected':''}>Picked Up</option>
					<option ${j.status==='In Transit'?'selected':''}>In Transit</option>
					<option ${j.status==='Out for Delivery'?'selected':''}>Out for Delivery</option>
					<option ${j.status==='Delivered'?'selected':''}>Delivered</option>
				</select>
			</td>
			<td>
				<input id="proof_${j.id}" type="file" accept="image/*">
			</td>
			<td>
				<button class="btn" onclick="window.acceptJob('${j.id}')">Accept</button>
				<button class="btn btn4" onclick="window.rejectJob('${j.id}')">Reject</button>
				<button class="btn btn2" onclick="window.updateJobStatus('${j.id}')">Update</button>
				<button class="btn btn3" onclick="window.uploadProof('${j.id}')">Upload Proof</button>
			</td>
		</tr>
	`).join('');
}

async function acceptJob(id){
	if(!id) return;
	const client = requireSupabaseClient();
	const { error } = await client.from("deliveries").update({ assignment_status:"Accepted", status:"Accepted" }).eq("id", id).eq("driver_id", driverId);
	if(error){ alert(error.message); return; }
	await loadJobs();
}
async function rejectJob(id){
	if(!id) return;
	const client = requireSupabaseClient();
	const { error } = await client.from("deliveries").update({ assignment_status:"Rejected", status:"Pending", driver_id:null, driver_name:null }).eq("id", id).eq("driver_id", driverId);
	if(error){ alert(error.message); return; }
	await loadJobs();
}
async function updateJobStatus(id){
	if(!id) return;
	const status = document.getElementById(`status_${id}`).value;
	const payload = { status };
	if(status === "Delivered") payload.delivery_time = new Date().toISOString();
	const client = requireSupabaseClient();
	const { error } = await client.from("deliveries").update(payload).eq("id", id).eq("driver_id", driverId);
	if(error){ alert(error.message); return; }
	await loadJobs();
}
async function uploadProof(id){
	if(!id) return;
	const input = document.getElementById(`proof_${id}`);
	if(!input.files || !input.files.length) return;
	const file = input.files[0];
	const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
	const path = `proofs/${id}_${Date.now()}.${ext}`;
	const client = requireSupabaseClient();
	const { error:upErr } = await client.storage.from("proofs").upload(path, file, { upsert: true });
	if(upErr){ alert(upErr.message); return; }
	const { data } = client.storage.from("proofs").getPublicUrl(path);
	const { error } = await client.from("deliveries").update({ proof_of_delivery: data.publicUrl, proof_photo_url: data.publicUrl }).eq("id", id).eq("driver_id", driverId);
	if(error){ alert(error.message); return; }
	await loadJobs();
}

function sendGPS(){
	if(!navigator.geolocation){ alert("Geolocation unavailable"); return; }
	navigator.geolocation.getCurrentPosition(async (p) => {
		const gpsPayload = {
			latitude: p.coords.latitude,
			longitude: p.coords.longitude,
			is_active: true,
			status: "Online",
			last_seen: new Date().toISOString(),
			updated_at: new Date().toISOString()
		};
		const { error } = await supabaseClient.from("drivers").update(gpsPayload).eq("id", driverId);
		if(error && (error.message || "").toLowerCase().includes("updated_at")){
			const retryPayload = { ...gpsPayload };
			delete retryPayload.updated_at;
			const { error: retryError } = await supabaseClient.from("drivers").update(retryPayload).eq("id", driverId);
			if(retryError){ alert(retryError.message); return; }
		}else if(error){
			alert(error.message);
			return;
		}
		alert("GPS sent");
	});
}

async function clockIn(){
	const client = requireSupabaseClient();
	const { data, error } = await client.from("timesheets").insert([{ driver_id: driverId, clock_in_at: new Date().toISOString(), status: "Open" }]).select().single();
	if(error){ alert(error.message); return; }
	if(data){ activeTimesheetId = data.id; document.getElementById("clockStatus").innerText = "On"; }
}
async function clockOut(){
	if(!activeTimesheetId){ return; }
	const client = requireSupabaseClient();
	const { error } = await client.from("timesheets").update({ clock_out_at: new Date().toISOString(), status: "Closed" }).eq("id", activeTimesheetId).eq("driver_id", driverId);
	if(error){ alert(error.message); return; }
	activeTimesheetId = null;
	activeBreakStartedAt = null;
	document.getElementById("clockStatus").innerText = "Off";
}

async function breakStart(){
	if(!activeTimesheetId){ await clockIn(); }
	activeBreakStartedAt = new Date().toISOString();
	if(activeTimesheetId){
		const client = requireSupabaseClient();
		const { error } = await client.from("timesheets").update({ break_started_at: activeBreakStartedAt, status: "On Break" }).eq("id", activeTimesheetId).eq("driver_id", driverId);
		if(error){ alert(error.message); return; }
	}
}

async function breakEnd(){
	if(!activeTimesheetId){ return; }
	const client = requireSupabaseClient();
	const { error } = await client.from("timesheets").update({ break_ended_at: new Date().toISOString(), status: "Open" }).eq("id", activeTimesheetId).eq("driver_id", driverId);
	if(error){ alert(error.message); return; }
	activeBreakStartedAt = null;
}

window.clockIn = clockIn;
window.clockOut = clockOut;
window.breakStart = breakStart;
window.breakEnd = breakEnd;
window.acceptJob = acceptJob;
window.rejectJob = rejectJob;
window.updateJobStatus = updateJobStatus;
window.uploadProof = uploadProof;

loadJobs();
</script>
</body>
</html>
