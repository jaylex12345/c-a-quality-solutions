<body>
<div class="header"><h1>Legacy URL Redirect Page: driver history</h1></div>
<div class="nav">
  <a href="driver-login.html">Login</a>
  <a href="driver-dashboard.html">Dashboard</a>
  <a href="driver-profile.html">Profile</a>
  <a href="driver-history.html">History</a>
</div>
<div class="container">
  <div class="card">
    <table>
      <thead><tr><th>Tracking</th><th>Customer</th><th>Status</th><th>Delivered</th><th>Proof</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
  </div>
</div>
<script>
const supabaseUrl = "" + (window.CAQ_SUPABASE_URL || "") + "";
const supabaseKey = "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
const driverId = localStorage.getItem("driver_id");
if(!driverId){ window.location.href = "driver-login.html"; }

async function loadHistory(){
  const { data, error } = await supabaseClient
    .from("deliveries")
    .select("*")
    .eq("driver_id", driverId)
    .in("status", ["Delivered","Completed"]) 
    .order("delivery_time", { ascending:false });
  if(error){ document.getElementById("rows").innerHTML = `<tr><td colspan="5">${error.message}</td></tr>`; return; }
  const rows = data || [];
  if(!rows.length){ document.getElementById("rows").innerHTML = '<tr><td colspan="5">No history yet.</td></tr>'; return; }
  document.getElementById("rows").innerHTML = rows.map(d => `
    <tr>
      <td>${d.tracking_number || ''}</td>
      <td>${d.customer_name || ''}</td>
      <td><span class="badge">${d.status || 'Delivered'}</span></td>
      <td>${d.delivery_time ? new Date(d.delivery_time).toLocaleString() : ''}</td>
      <td>${d.proof_of_delivery ? `<a href="${d.proof_of_delivery}" target="_blank">View</a>` : 'N/A'}</td>
    </tr>
  `).join('');
}

loadHistory();
</script>
