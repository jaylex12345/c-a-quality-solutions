<body>

<header>
<h1>C&A Quality Solutions</h1>
<p>Professional Courier & Transportation Booking</p>

<nav>
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>
  <a href="pricing.html">Pricing</a>
  <a href="about.html">About Us</a>
  <a href="contact.html">Contact</a>
  <a href="booking.html">Book Now</a>
</nav>

</header>

<div class="container">
<div class="card">

<h2>Book Your Transportation Service</h2>

<form action="https://formspree.io/f/xredagoj" method="POST">

<label>Full Name</label>
<input type="text" name="Customer Name" required>

<label>Phone Number</label>
<input type="text" name="Phone Number" required>

<label>Service Type</label>
<select name="Service Type" required>
<option>Courier Delivery</option>
<option>Medical Courier</option>
<option>Scheduled Transportation</option>
<option>Priority Delivery</option>
</select>

<label>Pickup Address</label>
<input type="text" id="pickup" name="Pickup Address" required>

<label>Drop-off Address</label>
<input type="text" id="dropoff" name="Drop-off Address" required>

<label>Estimated Miles</label>
<input type="number" id="miles" name="Estimated Miles" readonly>

<label>Special Instructions</label>
<textarea name="Instructions"></textarea>



<button class="calculate" type="button" onclick="calculatePrice()">
  Calculate Price
</button>

<div class="price-box" id="result">
Estimated Price: $0.00
</div>
<input type="hidden" id="estimatedPrice" name="Estimated Price">

<button class="submit" type="submit">
Submit Booking
</button>

</form>

<a class="whatsapp" href="https://wa.me/14108785949">
Message Us on WhatsApp
</a>

</div>
</div>

<footer>
© 2026 C&A Quality Solutions LLC
</footer>



<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCnOUiDU0upL9wbMydckFUKtPbIZEIKqns"></script>

<script>
function calculatePrice() {
    const pickup = document.getElementById("pickup").value;
    const dropoff = document.getElementById("dropoff").value;

    if (!pickup || !dropoff) {
        alert("Enter pickup and drop-off addresses");
        return;
    }

    const service = new google.maps.DistanceMatrixService();

    service.getDistanceMatrix({
        origins: [pickup],
        destinations: [dropoff],
        travelMode: google.maps.TravelMode.DRIVING,
        unitSystem: google.maps.UnitSystem.IMPERIAL
    }, function(response, status) {

        if (status !== "OK") {
            alert("Google Maps Error: " + status);
            return;
        }

        const distance = response.rows[0].elements[0];

        if (distance.status !== "OK") {
            alert("Route not found");
            return;
        }

        const miles = distance.distance.value / 1609.34;
        const total = 35 + (miles * 2.5);

        document.getElementById("result").innerText =
            "Estimated Price: $" + total.toFixed(2);

            document.getElementById("miles").value = miles.toFixed(1);

        document.getElementById("estimatedPrice").value =
            total.toFixed(2);
    });
}
</script>
