<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Now | C&A Quality Solutions</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
color:#111;
}

header{
background:#061f45;
color:white;
padding:20px;
text-align:center;
}

header h1{
font-size:32px;
}

header p{
color:#f2b632;
margin-top:8px;
}

.container{
max-width:1000px;
margin:40px auto;
padding:20px;
}

.card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h2{
color:#061f45;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input, select, textarea{
width:100%;
padding:15px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:16px;
margin-top:20px;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.calculate{
background:#f2b632;
color:#061f45;
}

.submit{
background:#061f45;
color:white;
}

.price-box{
margin-top:20px;
padding:20px;
background:#061f45;
color:white;
font-size:24px;
text-align:center;
border-radius:12px;
font-weight:bold;
}

.whatsapp{
display:block;
text-align:center;
margin-top:20px;
padding:16px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
font-size:18px;
}

footer{
text-align:center;
padding:20px;
margin-top:40px;
background:#061f45;
color:white;
}
</style>
</head>

<body>

<header>
<h1>C&A Quality Solutions</h1>
<p>Professional Courier & Transportation Booking</p>

<nav>
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>
  <a href="pricing.html">Pricing</a>
  <a href="about.html">About Us</a>
  <a href="contact.html">Contact</a>
  <a href="booking.html">Book Now</a>
</nav>

</header>

<div class="container">
<div class="card">

<h2>Book Your Transportation Service</h2>

<form action="https://formspree.io/f/xredagoj" method="POST">

<label>Full Name</label>
<input type="text" name="Customer Name" required>

<label>Phone Number</label>
<input type="text" name="Phone Number" required>

<label>Service Type</label>
<select name="Service Type" required>
<option>Courier Delivery</option>
<option>Medical Courier</option>
<option>Scheduled Transportation</option>
<option>Priority Delivery</option>
</select>

<label>Pickup Address</label>
<input type="text" name="Pickup Address" required>

<label>Drop-off Address</label>
<input type="text" name="Drop-off Address" required>

<label>Estimated Miles</label>
<input type="number" name="Estimated Miles" required>

<label>Special Instructions</label>
<textarea name="Instructions"></textarea>



<button class="calculate" type="button" onclick="calculatePrice()">Calculate Price</button>

<div class="price-box" id="result">
Estimated Price: $0.00
</div>

<input type="hidden" name="Estimated Price" id="estimatedPrice">

</form>

<a class="whatsapp" href="https://wa.me/14108785949">
Message Us on WhatsApp
</a>

</div>
</div>

<footer>
© 2026 C&A Quality Solutions LLC
</footer>

<script>
function calculatePrice(){
let miles = document.getElementById("miles").value;
let total = miles * 2.5;

if(total < 30){
total = 30;
}

document.getElementById("result").innerHTML =
"Estimated Price: $" + total.toFixed(2);

document.getElementById("estimatedPrice").value =
"$" + total.toFixed(2);
}
</script>

</body>
