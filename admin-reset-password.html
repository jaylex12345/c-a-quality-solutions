<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Reset Password | C&A Quality Solutions LLC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#fff;padding:30px;width:380px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
input{width:100%;padding:12px;margin-bottom:12px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#0b2d52;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div class="card">
  <h2>Reset Admin Password</h2>
  <input id="newPassword" type="password" placeholder="New Password">
  <input id="confirmPassword" type="password" placeholder="Confirm Password">
  <button onclick="resetPassword()">Update Password</button>
  <p id="msg"></p>
  <p><a href="/login">Back to login</a></p>
</div>

<script>
const supabaseClient = supabase.createClient("https://ncdozhypelmkvaxsdwwt.supabase.co", "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR");

async function resetPassword(){
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const msg = document.getElementById("msg");

  if(!newPassword || !confirmPassword){
    msg.innerText = "Both fields are required.";
    return;
  }

  if(newPassword !== confirmPassword){
    msg.innerText = "Passwords do not match.";
    return;
  }

  const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
  if(error){
    msg.innerText = error.message;
    return;
  }

  msg.innerText = "Password updated. Redirecting to login...";
  await supabaseClient.auth.signOut();
  setTimeout(() => {
    window.location.href = "/login";
  }, 900);
}
</script>
</body>
</html>
