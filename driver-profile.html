<body>
<div class="header"><h1>Legacy URL Redirect Page: driver profile</h1></div>
<div class="nav">
  <a href="driver-login.html">Login</a>
  <a href="driver-dashboard.html">Dashboard</a>
  <a href="driver-profile.html">Profile</a>
  <a href="driver-history.html">History</a>
</div>
<div class="container">
  <div class="card">
    <div class="grid">
      <input id="name" placeholder="Name">
      <input id="email" placeholder="Email">
      <input id="phone" placeholder="Phone">
      <input id="vehicle" placeholder="Vehicle">
      <input id="license_plate" placeholder="License plate">
      <input id="availability" placeholder="Availability">
    </div>
    <button class="btn" onclick="saveProfile()">Save Profile</button>
    <p id="msg"></p>
  </div>
</div>
<script>
const supabaseUrl = "https://ncdozhypelmkvaxsdwwt.supabase.co";
const supabaseKey = "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
const driverId = localStorage.getItem("driver_id");
if(!driverId){ window.location.href = "driver-login.html"; }

async function loadProfile(){
  const { data, error } = await supabaseClient.from("drivers").select("*").eq("id", driverId).single();
  if(error || !data){ document.getElementById("msg").innerText = error ? error.message : "Driver not found"; return; }
  ["name","email","phone","vehicle","license_plate","availability"].forEach(key => {
    document.getElementById(key).value = data[key] || "";
  });
}

async function saveProfile(){
  const payload = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    vehicle: document.getElementById("vehicle").value.trim(),
    license_plate: document.getElementById("license_plate").value.trim(),
    availability: document.getElementById("availability").value.trim()
  };
  const { error } = await supabaseClient.from("drivers").update(payload).eq("id", driverId);
  document.getElementById("msg").innerText = error ? error.message : "Profile updated.";
}

loadProfile();
</script>
</body>
