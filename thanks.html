<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed | C&A Quality Solutions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      text-align: center;
      padding: 80px 20px;
    }

    .box {
      background: white;
      max-width: 700px;
      margin: auto;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      color: #0066cc;
    }

    p {
      font-size: 18px;
      margin: 20px 0;
    }

    a {
      display: inline-block;
      background: #0066cc;
      color: white;
      padding: 14px 25px;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Booking Request Received</h1>
    <p>Thank you for choosing C&A Quality Solutions.</p>
    <p>Your ride request has been submitted successfully.</p>
    <p>Please complete your $10 booking deposit to confirm your reservation.</p>

    <p id="estimatedPrice"></p>
<p><strong>Deposit Paid:</strong> $10.00</p>
<p id="remainingBalance"></p>

    <a href="/customer/booking.html">Back to Booking</a>
  </div>

<script>
const totalPrice = localStorage.getItem("estimatedPrice");

if (totalPrice) {
    const balance = parseFloat(totalPrice) - 10;

    document.getElementById("estimatedPrice").innerText =
        "Total Ride Cost: $" + parseFloat(totalPrice).toFixed(2);

    document.getElementById("remainingBalance").innerText =
        "Remaining Balance Due Before Pickup: $" + balance.toFixed(2);
}
</script>

</body>
</html>
