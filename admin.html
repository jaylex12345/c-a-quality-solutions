<body>
<div class="layout">
	<aside class="side">
		<img src="/assets/images/logo.jpeg" alt="Logo">
		<a class="active" href="admin.html">Dashboard</a>
		<a href="dispatcher.html">Dispatcher</a>
		<a href="drivers.html">Drivers</a>
		<a href="deliveries.html">Deliveries</a>
		<a href="customers.html">Customers</a>
		<a href="reports.html">Reports</a>
		<a href="settings.html">Settings</a>
		<a href="#" onclick="logout()">Logout</a>
	</aside>
	<main class="main">
		<h1>Legacy URL Redirect Page: admin</h1>
		<div class="cards">
			<div class="card"><h3>Deliveries</h3><div class="value" id="deliveriesCount">0</div></div>
			<div class="card"><h3>Pending</h3><div class="value" id="pendingCount">0</div></div>
			<div class="card"><h3>Drivers</h3><div class="value" id="driversCount">0</div></div>
			<div class="card"><h3>Customers</h3><div class="value" id="customersCount">0</div></div>
			<div class="card"><h3>Revenue</h3><div class="value" id="revenue">$0</div></div>
		</div>
		<div class="card" style="margin-top:14px;">
			<h2>Add Driver</h2>
			<input id="name" placeholder="Driver name">
			<input id="phone" placeholder="Phone">
			<input id="email" placeholder="Email">
			<input id="password" placeholder="Password">
			<button class="btn" onclick="addDriver()">Create Driver</button>
			<p id="msg"></p>
		</div>
		<div class="card" style="margin-top:14px;">
			<h2>Recent Customers</h2>
			<div style="overflow:auto;">
				<table style="width:100%;border-collapse:collapse;min-width:760px;">
					<thead>
						<tr>
							<th style="text-align:left;background:#061b3a;color:#fff;padding:10px;">Business</th>
							<th style="text-align:left;background:#061b3a;color:#fff;padding:10px;">Contact</th>
							<th style="text-align:left;background:#061b3a;color:#fff;padding:10px;">Email</th>
							<th style="text-align:left;background:#061b3a;color:#fff;padding:10px;">Phone</th>
							<th style="text-align:left;background:#061b3a;color:#fff;padding:10px;">Status</th>
						</tr>
					</thead>
					<tbody id="customersTableBody">
						<tr><td colspan="5" style="padding:10px;">Loading customers...</td></tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>
</div>
<script>
const supabaseClient = supabase.createClient("https://ncdozhypelmkvaxsdwwt.supabase.co", "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR");
if(localStorage.getItem("role") !== "admin") window.location.href = "login.html";

function logout(){ localStorage.clear(); window.location.href = "login.html"; }

async function loadStats(){
	const [{data:deliveries},{data:drivers},{data:customers}] = await Promise.all([
		supabaseClient.from("deliveries").select("status,total_price"),
		supabaseClient.from("drivers").select("id"),
		supabaseClient.from("customers").select("id")
	]);
	const d = deliveries || [];
	document.getElementById("deliveriesCount").innerText = d.length;
	document.getElementById("pendingCount").innerText = d.filter(x => (x.status || "").toLowerCase() === "pending").length;
	document.getElementById("driversCount").innerText = (drivers || []).length;
	document.getElementById("customersCount").innerText = (customers || []).length;
	const total = d.reduce((n,x)=>n + Number(x.total_price || 0),0);
	document.getElementById("revenue").innerText = `$${total.toFixed(2)}`;
}

async function loadRecentCustomers(){
	const { data, error } = await supabaseClient
		.from("customers")
		.select("business_name,contact_person,email,phone,account_status,created_at")
		.order("created_at", { ascending: false })
		.limit(8);

	const body = document.getElementById("customersTableBody");
	if(error){
		body.innerHTML = `<tr><td colspan="5" style="padding:10px;">${error.message}</td></tr>`;
		return;
	}

	const rows = data || [];
	if(!rows.length){
		body.innerHTML = '<tr><td colspan="5" style="padding:10px;">No customers found.</td></tr>';
		return;
	}

	body.innerHTML = rows.map(customer => `
		<tr>
			<td style="padding:10px;border-bottom:1px solid #e5e7eb;">${customer.business_name || ""}</td>
			<td style="padding:10px;border-bottom:1px solid #e5e7eb;">${customer.contact_person || ""}</td>
			<td style="padding:10px;border-bottom:1px solid #e5e7eb;">${customer.email || ""}</td>
			<td style="padding:10px;border-bottom:1px solid #e5e7eb;">${customer.phone || ""}</td>
			<td style="padding:10px;border-bottom:1px solid #e5e7eb;">${customer.account_status || "Active"}</td>
		</tr>
	`).join("");
}

async function addDriver(){
	const payload = {
		name: document.getElementById("name").value.trim(),
		phone: document.getElementById("phone").value.trim(),
		email: document.getElementById("email").value.trim(),
		password: document.getElementById("password").value.trim(),
		is_active: true,
		status: "Available"
	};
	if(!payload.name || !payload.phone || !payload.email || !payload.password){
		document.getElementById("msg").innerText = "All fields are required.";
		return;
	}
	const { error } = await supabaseClient.from("drivers").insert([payload]);
	document.getElementById("msg").innerText = error ? error.message : "Driver created.";
	if(!error) loadStats();
}

loadStats();
loadRecentCustomers();
</script>
</body>
</html>
