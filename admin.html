<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | C&A Quality Solutions LLC</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://caqualitysolutions.com/admin.html">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const OWNER_ADMIN_EMAILS = [
      "james@caqualitysolutions.com",
      "alexisbright@caqualitysolutions.com"
    ];

    function normalizeEmail(email){
      return String(email || "").trim().toLowerCase();
    }

    function isAllowedOwner(email){
      return OWNER_ADMIN_EMAILS.includes(normalizeEmail(email));
    }

    async function checkAdminSession(){
      const supabaseClient = supabase.createClient("https://ncdozhypelmkvaxsdwwt.supabase.co", "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR");
      const sessionResult = await supabaseClient.auth.getSession();
      const session = sessionResult && sessionResult.data ? sessionResult.data.session : null;

      if(!session || !session.user || !isAllowedOwner(session.user.email)){
        try { await supabaseClient.auth.signOut(); } catch (_) { }
        localStorage.removeItem("role");
        localStorage.removeItem("admin_auth_email");
        localStorage.removeItem("admin_auth_ok");
        window.location.replace("/login.html");
        return;
      }

      localStorage.setItem("role", "admin");
      localStorage.setItem("admin_auth_email", normalizeEmail(session.user.email));
      localStorage.setItem("admin_auth_ok", "true");
      window.location.replace("/admin/dashboard.html");
    }

    checkAdminSession();
  </script>
</head>
<body></body>
</html>
