<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Version 5.0 | Invoices</title>
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#071b33;}
.admin-layout{display:flex;min-height:100vh;}
.sidebar{width:260px;background:#0b2d52;color:white;padding:25px 18px;}
.sidebar img{width:110px;display:block;margin:0 auto 20px;}
.sidebar h2{text-align:center;font-size:20px;}
.sidebar a{display:block;color:white;text-decoration:none;padding:12px 14px;margin:6px 0;border-radius:8px;}
.sidebar a:hover,.sidebar a.active{background:#d9b431;color:#071b33;}
.main{flex:1;padding:30px;}
.section{background:white;padding:22px;border-radius:14px;box-shadow:0 5px 15px rgba(0,0,0,.08);margin-bottom:20px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap;}
.btn{background:#d9b431;color:#071b33;padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
.btn-blue{background:#0b2d52;color:white;}
.btn-green{background:#16a34a;color:white;}
.btn-red{background:#dc2626;color:white;}
.actions{display:flex;gap:8px;flex-wrap:wrap;}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
input,select{width:100%;padding:11px;border:1px solid #cfd8e3;border-radius:10px;box-sizing:border-box;}
.table-wrap{overflow:auto;}
table{width:100%;border-collapse:collapse;min-width:1200px;}
th{background:#0b2d52;color:white;padding:12px;text-align:left;}
td{padding:12px;border-bottom:1px solid #e5e7eb;}
.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:bold;display:inline-block;}
.paid{background:#dcfce7;color:#166534;}
.pending{background:#fee2e2;color:#991b1b;}
.sent{background:#dbeafe;color:#1d4ed8;}
.muted{color:#6b7280;}
@media(max-width:1100px){.admin-layout{flex-direction:column}.sidebar{width:100%}.form-grid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <img src="/assets/images/logo.jpeg" alt="C&A Logo">
    <h2>C&A CMS 5.0</h2>
    <a href="/admin/dashboard.html">Dashboard</a>
    <a href="/admin/dispatcher.html">Dispatcher</a>
    <a href="/deliveries.html">Deliveries</a>
    <a href="/drivers.html">Drivers</a>
    <a href="employees.html">Employees</a>
    <a href="customers.html">Customers</a>
    <a href="/customer/booking.html">Booking</a>
    <a href="payroll.html">Payroll</a>
    <a href="invoices.html" class="active">Invoices</a>
    <a href="reports.html">Reports</a>
    <a href="settings.html">Settings</a>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Invoices</h1>
        <p class="muted">Generate, email, print, and download customer invoices.</p>
      </div>
      <div class="actions">
        <button class="btn" onclick="loadInvoices()">Refresh</button>
      </div>
    </div>

    <div class="section">
      <h2>Create Invoice</h2>
      <div class="form-grid">
        <input id="invoiceNumber" placeholder="Invoice Number (auto)">
        <input id="customerName" placeholder="Customer">
        <input id="deliveryIds" placeholder="Delivery IDs (comma separated)">
        <input id="amount" type="number" step="0.01" placeholder="Amount">
        <input id="dueDate" type="date" placeholder="Due Date">
        <select id="invoiceStatus">
          <option value="Pending">Pending</option>
          <option value="Sent">Sent</option>
          <option value="Paid">Paid</option>
        </select>
        <input id="customerEmail" type="email" placeholder="Customer Email">
      </div>
      <div class="actions" style="margin-top:12px;">
        <button class="btn" onclick="generateInvoice()">Generate Invoice</button>
      </div>
      <p id="message" class="muted"></p>
    </div>

    <div class="section table-wrap">
      <h2>Invoice Register</h2>
      <table>
        <thead>
          <tr>
            <th>Invoice #</th>
            <th>Customer</th>
            <th>Deliveries</th>
            <th>Amount</th>
            <th>Due Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="invoiceTable">
          <tr><td colspan="7" class="muted">Loading invoices...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
const supabaseUrl = "https://ncdozhypelmkvaxsdwwt.supabase.co";
const supabaseKey = "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

const role = localStorage.getItem("role");
if(role !== "admin" && role !== "dispatcher"){
  window.location.href = "login.html";
}

let invoices = [];

function fmtMoney(value){
  return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(Number(value || 0));
}

function autoInvoiceNumber(){
  return "INV-" + new Date().toISOString().replace(/[-:TZ.]/g, "").slice(0, 12);
}

function badge(status){
  if(status === "Paid") return '<span class="badge paid">Paid</span>';
  if(status === "Sent") return '<span class="badge sent">Sent</span>';
  return '<span class="badge pending">Pending</span>';
}

function clearForm(){
  document.getElementById("invoiceNumber").value = autoInvoiceNumber();
  ["customerName","deliveryIds","amount","dueDate","customerEmail"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("invoiceStatus").value = "Pending";
}

async function loadInvoices(){
  const { data, error } = await supabaseClient.from("invoices").select("*").order("created_at", { ascending: false });
  if(error){
    document.getElementById("invoiceTable").innerHTML = `<tr><td colspan="7">${error.message}</td></tr>`;
    return;
  }

  invoices = data || [];
  if(!invoices.length){
    document.getElementById("invoiceTable").innerHTML = `<tr><td colspan="7" class="muted">No invoices yet.</td></tr>`;
    return;
  }

  document.getElementById("invoiceTable").innerHTML = invoices.map(invoice => `
    <tr>
      <td>${invoice.invoice_number || ""}</td>
      <td>${invoice.customer_name || ""}</td>
      <td>${Array.isArray(invoice.delivery_ids) ? invoice.delivery_ids.join(", ") : (invoice.delivery_ids || "")}</td>
      <td>${fmtMoney(invoice.amount)}</td>
      <td>${invoice.due_date ? new Date(invoice.due_date).toLocaleDateString() : ""}</td>
      <td>${badge(invoice.status)}</td>
      <td>
        <div class="actions">
          <button class="btn btn-blue" onclick="emailInvoice('${invoice.id}')">Email</button>
          <button class="btn btn-blue" onclick="printInvoice('${invoice.id}')">Print</button>
          <button class="btn btn-green" onclick="downloadInvoicePdf('${invoice.id}')">Download PDF</button>
          <button class="btn" onclick="markInvoicePaid('${invoice.id}')">Mark Paid</button>
        </div>
      </td>
    </tr>
  `).join("");
}

async function generateInvoice(){
  const payload = {
    invoice_number: document.getElementById("invoiceNumber").value.trim() || autoInvoiceNumber(),
    customer_name: document.getElementById("customerName").value.trim(),
    delivery_ids: document.getElementById("deliveryIds").value.split(",").map(value => value.trim()).filter(Boolean),
    amount: Number(document.getElementById("amount").value || 0),
    due_date: document.getElementById("dueDate").value || null,
    status: document.getElementById("invoiceStatus").value,
    customer_email: document.getElementById("customerEmail").value.trim() || null
  };

  if(!payload.customer_name || payload.amount <= 0){
    document.getElementById("message").innerText = "Customer and amount are required.";
    return;
  }

  const { error } = await supabaseClient.from("invoices").insert([payload]);
  if(error){
    document.getElementById("message").innerText = error.message;
    return;
  }

  document.getElementById("message").innerText = "Invoice generated.";
  clearForm();
  loadInvoices();
}

function getInvoice(id){
  return invoices.find(item => String(item.id) === String(id));
}

function emailInvoice(id){
  const invoice = getInvoice(id);
  if(!invoice) return;
  if(!invoice.customer_email) return alert("No customer email on invoice.");
  const subject = encodeURIComponent(`Invoice ${invoice.invoice_number}`);
  const body = encodeURIComponent(`Hello,\n\nInvoice ${invoice.invoice_number} for ${fmtMoney(invoice.amount)} is due ${invoice.due_date || "soon"}.`);
  window.location.href = `mailto:${invoice.customer_email}?subject=${subject}&body=${body}`;
}

function printInvoice(id){
  const invoice = getInvoice(id);
  if(!invoice) return;
  const printWindow = window.open("", "_blank", "width=900,height=700");
  printWindow.document.write(`
    <html><head><title>Invoice ${invoice.invoice_number}</title></head>
    <body style="font-family:Arial;padding:28px;color:#071b33;">
      <h1>C&A Quality Solutions LLC</h1>
      <h2>Invoice ${invoice.invoice_number}</h2>
      <p><strong>Customer:</strong> ${invoice.customer_name}</p>
      <p><strong>Deliveries:</strong> ${(invoice.delivery_ids || []).join(", ")}</p>
      <p><strong>Amount:</strong> ${fmtMoney(invoice.amount)}</p>
      <p><strong>Due Date:</strong> ${invoice.due_date || "N/A"}</p>
      <p><strong>Status:</strong> ${invoice.status}</p>
    </body></html>
  `);
  printWindow.document.close();
  printWindow.focus();
  printWindow.print();
}

function downloadInvoicePdf(id){
  const invoice = getInvoice(id);
  if(!invoice || !window.jspdf) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18);
  doc.text("C&A Quality Solutions LLC", 20, 20);
  doc.setFontSize(14);
  doc.text(`Invoice ${invoice.invoice_number}`, 20, 34);
  doc.setFontSize(12);
  doc.text(`Customer: ${invoice.customer_name}`, 20, 46);
  doc.text(`Deliveries: ${(invoice.delivery_ids || []).join(", ")}`, 20, 56, { maxWidth: 170 });
  doc.text(`Amount: ${fmtMoney(invoice.amount)}`, 20, 70);
  doc.text(`Due Date: ${invoice.due_date || "N/A"}`, 20, 80);
  doc.text(`Status: ${invoice.status}`, 20, 90);
  doc.save(`${invoice.invoice_number || "invoice"}.pdf`);
}

async function markInvoicePaid(id){
  const { error } = await supabaseClient.from("invoices").update({ status: "Paid", paid_at: new Date().toISOString() }).eq("id", id);
  if(error){
    alert(error.message);
    return;
  }
  loadInvoices();
}

clearForm();
loadInvoices();
</script>
</body>
</html>
