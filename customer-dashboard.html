<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Dashboard | C&A Quality Solutions</title>
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#071b33}
.header{background:#061b3a;color:#fff;padding:20px;text-align:center}
.nav{background:#0b2d52;padding:12px;text-align:center}
.nav a{color:#fff;text-decoration:none;margin:0 10px;font-weight:bold}
.container{max-width:1200px;margin:24px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}th{background:#061b3a;color:#fff;padding:10px;text-align:left}td{padding:10px;border-bottom:1px solid #e5e7eb}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header"><h1>Customer Dashboard</h1></div>
<div class="nav">
<a href="customer-login.html">Login</a>
<a href="customer-dashboard.html">Dashboard</a>
<a href="customer-profile.html">Profile</a>
<a href="customer-invoices.html">Invoices</a>
<a href="booking.html">Booking</a>
<a href="track.html">Tracking</a>
</div>
<div class="container">
  <div class="grid">
    <div class="card"><h3>My Bookings</h3><p id="bookingCount">0</p></div>
    <div class="card"><h3>My Deliveries</h3><p id="deliveryCount">0</p></div>
    <div class="card"><h3>My Invoices</h3><p id="invoiceCount">0</p></div>
  </div>
  <div class="card" style="margin-top:16px;">
    <h3>Recent Activity</h3>
    <table><thead><tr><th>Type</th><th>Reference</th><th>Status</th><th>Date</th></tr></thead><tbody id="activity"><tr><td colspan="4">Loading...</td></tr></tbody></table>
  </div>
</div>
<script>
const supabaseUrl='https://ncdozhypelmkvaxsdwwt.supabase.co';
const supabaseKey='sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR';
const supabaseClient=supabase.createClient(supabaseUrl,supabaseKey);
const customerEmail=localStorage.getItem('customer_email');
const customerName=localStorage.getItem('customer_name');
if(!customerEmail){window.location.href='customer-login.html';}

async function loadData(){
  const [bookingsRes, deliveriesRes, invoicesRes] = await Promise.all([
    supabaseClient.from('bookings').select('*').eq('customer_email', customerEmail),
    supabaseClient.from('deliveries').select('*').or(`customer_email.eq.${customerEmail},customer_name.eq.${customerName||''}`),
    supabaseClient.from('invoices').select('*').or(`customer_email.eq.${customerEmail},customer_name.eq.${customerName||''}`)
  ]);
  const bookings = bookingsRes.data || [];
  const deliveries = deliveriesRes.data || [];
  const invoices = invoicesRes.data || [];
  document.getElementById('bookingCount').innerText = bookings.length;
  document.getElementById('deliveryCount').innerText = deliveries.length;
  document.getElementById('invoiceCount').innerText = invoices.length;

  const activity = [];
  bookings.forEach(item=>activity.push({type:'Booking',ref:item.tracking_number||item.id,status:item.payment_status||'Pending',date:item.created_at}));
  deliveries.forEach(item=>activity.push({type:'Delivery',ref:item.tracking_number||item.id,status:item.status||'Pending',date:item.created_at}));
  invoices.forEach(item=>activity.push({type:'Invoice',ref:item.invoice_number||item.id,status:item.status||'Pending',date:item.created_at}));
  activity.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  const rows = activity.slice(0,20);
  document.getElementById('activity').innerHTML = rows.length ? rows.map(r=>`<tr><td>${r.type}</td><td>${r.ref||''}</td><td>${r.status||''}</td><td>${r.date?new Date(r.date).toLocaleString():''}</td></tr>`).join('') : '<tr><td colspan="4">No activity yet.</td></tr>';
}

loadData();
</script>
</body>
</html>
