<html lang="en">
<head>

<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#071b33}
.header{background:#061b3a;color:#fff;padding:20px;text-align:center}
.nav{background:#0b2d52;padding:12px;text-align:center}
.nav a{color:#fff;text-decoration:none;margin:0 10px;font-weight:bold}
.container{max-width:1200px;margin:24px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}th{background:#061b3a;color:#fff;padding:10px;text-align:left}td{padding:10px;border-bottom:1px solid #e5e7eb}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
</style>
  <meta name="description" content="Official customer dashboard page for C&A Quality Solutions LLC operations and customer support.">
  <link rel="canonical" href="https://caqualitysolutions.com/customer-dashboard.html">
  <meta name="robots" content="noindex, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Customer Dashboard | C&A Quality Solutions LLC">
  <meta property="og:description" content="Official customer dashboard page for C&A Quality Solutions LLC operations and customer support.">
  <meta property="og:url" content="https://caqualitysolutions.com/customer-dashboard.html">
  <meta property="og:image" content="https://caqualitysolutions.com/assets/images/logo.jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Customer Dashboard | C&A Quality Solutions LLC">
  <meta name="twitter:description" content="Official customer dashboard page for C&A Quality Solutions LLC operations and customer support.">

  <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpeg">
  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}</style>
</head>
<body>
<div class="header"><h1>Customer Dashboard</h1></div>
<div class="nav">
<a href="customer-login.html">Login</a>
<a href="customer-dashboard.html">Dashboard</a>
<a href="customer-profile.html">Profile</a>
<a href="customer-invoices.html">Invoices</a>
<a href="booking.html">Booking</a>
<a href="track.html">Tracking</a>
</div>
<div class="container">
  <div class="grid">
    <div class="card"><h3>My Bookings</h3><p id="bookingCount">0</p></div>
    <div class="card"><h3>My Deliveries</h3><p id="deliveryCount">0</p></div>
    <div class="card"><h3>My Invoices</h3><p id="invoiceCount">0</p></div>
  </div>
  <div class="card" style="margin-top:16px;">
    <h3>Recent Activity</h3>
    <table><thead><tr><th>Type</th><th>Reference</th><th>Status</th><th>Date</th></tr></thead><tbody id="activity"><tr><td colspan="4">Loading...</td></tr></tbody></table>
  </div>
</div>
<script>
const supabaseUrl='https://ncdozhypelmkvaxsdwwt.supabase.co';
const supabaseKey='sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR';
const supabaseClient=supabase.createClient(supabaseUrl,supabaseKey);
const customerId=localStorage.getItem('customer_id');
const customerEmail=localStorage.getItem('customer_email');
const customerName=localStorage.getItem('customer_name');
if(!customerEmail){window.location.href='customer-login.html';}

function mergeRows(...lists){
  const map = new Map();
  lists.flat().forEach(item => {
    if(!item) return;
    const key = item.id || `${item.tracking_number || ''}-${item.invoice_number || ''}-${item.created_at || ''}`;
    map.set(String(key), item);
  });
  return Array.from(map.values());
}

async function loadData(){
  const [
    bookingsByCustomerEmail,
    deliveriesByEmail,
    deliveriesByName,
    invoicesByEmail,
    invoicesByName,
    invoicesByCustomerId
  ] = await Promise.all([
    supabaseClient.from('bookings').select('*').eq('customer_email', customerEmail),
    supabaseClient.from('deliveries').select('*').eq('customer_email', customerEmail),
    supabaseClient.from('deliveries').select('*').eq('customer_name', customerName || ''),
    supabaseClient.from('invoices').select('*').eq('customer_email', customerEmail),
    supabaseClient.from('invoices').select('*').eq('customer_name', customerName || ''),
    customerId ? supabaseClient.from('invoices').select('*').eq('customer_id', customerId) : Promise.resolve({ data: [], error: null })
  ]);

  const firstError = [
    bookingsByCustomerEmail.error,
    deliveriesByEmail.error,
    deliveriesByName.error,
    invoicesByEmail.error,
    invoicesByName.error,
    invoicesByCustomerId.error
  ].find(Boolean);

  if(firstError){
    document.getElementById('activity').innerHTML = `<tr><td colspan="4">${firstError.message}</td></tr>`;
    return;
  }

  const bookings = mergeRows(bookingsByCustomerEmail.data || []);
  const deliveries = mergeRows(deliveriesByEmail.data || [], deliveriesByName.data || []);
  const invoices = mergeRows(invoicesByEmail.data || [], invoicesByName.data || [], invoicesByCustomerId.data || []);
  document.getElementById('bookingCount').innerText = bookings.length;
  document.getElementById('deliveryCount').innerText = deliveries.length;
  document.getElementById('invoiceCount').innerText = invoices.length;

  const activity = [];
  bookings.forEach(item=>activity.push({type:'Booking',ref:item.tracking_number||item.id,status:item.payment_status||'Pending',date:item.created_at}));
  deliveries.forEach(item=>activity.push({type:'Delivery',ref:item.tracking_number||item.id,status:item.status||'Pending',date:item.created_at}));
  invoices.forEach(item=>activity.push({type:'Invoice',ref:item.invoice_number||item.id,status:item.status||'Pending',date:item.created_at}));
  activity.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  const rows = activity.slice(0,20);
  document.getElementById('activity').innerHTML = rows.length ? rows.map(r=>`<tr><td>${r.type}</td><td>${r.ref||''}</td><td>${r.status||''}</td><td>${r.date?new Date(r.date).toLocaleString():''}</td></tr>`).join('') : '<tr><td colspan="4">No activity yet.</td></tr>';
}

loadData();
</script>
</body>
</html>
