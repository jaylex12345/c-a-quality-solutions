<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Admin Users | C&A Quality Solutions LLC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/admin-auth.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#fff;padding:30px;width:760px;max-width:94vw;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
input{width:100%;padding:12px;margin-bottom:12px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box}
select{width:100%;padding:12px;margin-bottom:12px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#0b2d52;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:16px}
th{background:#0b2d52;color:#fff;text-align:left;padding:10px}
td{padding:10px;border-bottom:1px solid #e5e7eb}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:#64748b}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
  <h2>Manage Admin Users</h2>
  <p class="muted">Owner-only page. Only James and Alexis can create portal users.</p>
  <div class="grid">
    <input id="fullName" placeholder="Full Name">
    <input id="email" type="email" placeholder="Email">
    <input id="phone" placeholder="Phone (optional)">
    <select id="role">
      <option value="admin">admin</option>
      <option value="dispatcher">dispatcher</option>
      <option value="driver">driver</option>
      <option value="customer">customer</option>
      <option value="super_admin">super_admin</option>
    </select>
    <input id="password" type="password" placeholder="Password">
    <input id="confirmPassword" type="password" placeholder="Confirm Password">
  </div>
  <button onclick="createUser()">Create User</button>
  <p id="msg"></p>
  <p><a href="/admin">Back to dashboard</a></p>

  <h3>Admin Accounts</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody id="adminTable">
      <tr><td colspan="4">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
const supabaseClient = supabase.createClient("https://ncdozhypelmkvaxsdwwt.supabase.co", "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR");
window.supabaseClient = supabaseClient;

async function authHeaders(){
  const session = (await supabaseClient.auth.getSession()).data.session;
  if(!session){
    window.location.href = "/login";
    return null;
  }
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${session.access_token}`
  };
}

async function loadAdminUsers(){
  const headers = await authHeaders();
  if(!headers) return;

  const response = await fetch("/.netlify/functions/admin-user-management", {
    method: "POST",
    headers,
    body: JSON.stringify({ action: "list_admin_users" })
  });

  const payload = await response.json();
  const table = document.getElementById("adminTable");
  if(!response.ok){
    table.innerHTML = `<tr><td colspan="4">${payload.error || "Unable to load users."}</td></tr>`;
    return;
  }

  const users = payload.users || [];
  if(!users.length){
    table.innerHTML = `<tr><td colspan="4">No admin users found.</td></tr>`;
    return;
  }

  table.innerHTML = users.map(user => `
    <tr>
      <td>${user.full_name || ""}</td>
      <td>${user.email || ""}</td>
      <td>${user.role || ""}</td>
      <td>${user.created_at ? new Date(user.created_at).toLocaleString() : ""}</td>
    </tr>
  `).join("");
}

async function createUser(){
  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const phone = document.getElementById("phone").value.trim();
  const role = document.getElementById("role").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const msg = document.getElementById("msg");
  const headers = await authHeaders();
  if(!headers) return;

  if(!fullName || !email || !password || !confirmPassword){
    msg.innerText = "All fields are required.";
    return;
  }

  if(password !== confirmPassword){
    msg.innerText = "Passwords do not match.";
    return;
  }

  const response = await fetch("/.netlify/functions/admin-user-management", {
    method: "POST",
    headers,
    body: JSON.stringify({
      action: "create_user",
      fullName,
      email,
      phone,
      role,
      password
    })
  });

  const payload = await response.json();
  if(!response.ok){
    msg.innerText = payload.error || "Unable to create user.";
    return;
  }

  msg.innerText = payload.message || "User created.";
  document.getElementById("fullName").value = "";
  document.getElementById("email").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("password").value = "";
  document.getElementById("confirmPassword").value = "";
  document.getElementById("role").value = "admin";
  loadAdminUsers();
}

requireSuperAdminAuth({ supabaseClient, loginPath: "/login" }).then(ok => {
  if(ok) loadAdminUsers();
});
</script>
</body>
</html>
