<body>
<h1 class="sr-only">Admin Login</h1>
<div class="card">
	<h2>C&A Admin Login</h2>
	<input id="email" placeholder="Email">
	<input id="password" type="password" placeholder="Password">
	<button onclick="login()">Login</button>
	<p id="msg"></p>
</div>
<script>
const supabaseClient = supabase.createClient("https://ncdozhypelmkvaxsdwwt.supabase.co", "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR");
const OWNER_ADMIN_EMAILS = [
  "james@caqualitysolutions.com",
  "alexisbright@caqualitysolutions.com"
];

function isOwnerAdminEmail(email){
  return OWNER_ADMIN_EMAILS.includes(String(email || "").trim().toLowerCase());
}

async function login(){
	const email = document.getElementById("email").value.trim().toLowerCase();
	const password = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");
  if(!email || !password){
    msg.innerText = "Enter email and password.";
    return;
  }

  if(!isOwnerAdminEmail(email)){
    msg.innerText = "Invalid email or password.";
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error || !data || !data.user){
    msg.innerText = "Invalid email or password.";
    return;
  }

  const sessionEmail = String(data.user.email || "").toLowerCase();
  if(!isOwnerAdminEmail(sessionEmail)){
    msg.innerText = "Invalid email or password.";
    return;
  }

  window.location.href = "/admin.html";
}
</script>
</body>
</html>
