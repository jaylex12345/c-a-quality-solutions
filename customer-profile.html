<body>
<div class="header"><h1>Legacy URL Redirect Page: customer profile</h1></div>
<div class="nav"><a href="customer-dashboard.html">Dashboard</a><a href="customer-profile.html">Profile</a><a href="customer-invoices.html">Invoices</a><a href="booking.html">Booking</a><a href="track.html">Tracking</a></div>
<div class="container">
  <div class="card">
    <div class="grid">
      <input id="business_name" placeholder="Business Name">
      <input id="contact_person" placeholder="Contact Person">
      <input id="email" placeholder="Email" readonly>
      <input id="phone" placeholder="Phone">
      <input id="billing_address" placeholder="Billing Address">
      <input id="payment_terms" placeholder="Payment Terms">
      <textarea id="notes" placeholder="Notes"></textarea>
    </div>
    <button class="btn" onclick="saveProfile()">Save Profile</button>
    <p id="msg"></p>
  </div>
</div>
<script>
const supabaseUrl='" + (window.CAQ_SUPABASE_URL || "") + "';
const supabaseKey='sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR';
const supabaseClient=supabase.createClient(supabaseUrl,supabaseKey);
const customerEmail=localStorage.getItem('customer_email');
if(!customerEmail){window.location.href='customer-login.html';}
let customerId=null;

async function loadProfile(){
  const {data,error}=await supabaseClient.from('customers').select('*').eq('email',customerEmail).limit(1);
  if(error||!data||!data.length){document.getElementById('msg').innerText = error ? error.message : 'Customer record not found'; return;}
  const c=data[0]; customerId=c.id;
  ['business_name','contact_person','email','phone','billing_address','payment_terms','notes'].forEach(k=>document.getElementById(k).value=c[k]||'');
}

async function saveProfile(){
  if(!customerId){document.getElementById('msg').innerText='No customer record.';return;}
  const payload={
    business_name:document.getElementById('business_name').value.trim(),
    contact_person:document.getElementById('contact_person').value.trim(),
    phone:document.getElementById('phone').value.trim(),
    billing_address:document.getElementById('billing_address').value.trim(),
    payment_terms:document.getElementById('payment_terms').value.trim(),
    notes:document.getElementById('notes').value.trim()
  };
  const {error}=await supabaseClient.from('customers').update(payload).eq('id',customerId);
  document.getElementById('msg').innerText=error?error.message:'Profile updated.';
}

loadProfile();
</script>
</body>
