<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driver Login | C&A Quality Solutions LLC</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <meta name="description" content="Official driver login page for C&A Quality Solutions LLC operations and customer support.">
  <link rel="canonical" href="https://caqualitysolutions.com/driver/login.html">
  <meta name="robots" content="noindex, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Driver Login | C&A Quality Solutions LLC">
  <meta property="og:description" content="Official driver login page for C&A Quality Solutions LLC operations and customer support.">
  <meta property="og:url" content="https://caqualitysolutions.com/driver/login.html">
  <meta property="og:image" content="https://caqualitysolutions.com/assets/images/logo.jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Driver Login | C&A Quality Solutions LLC">
  <meta name="twitter:description" content="Official driver login page for C&A Quality Solutions LLC operations and customer support.">
  <meta name="twitter:image" content="https://caqualitysolutions.com/assets/images/logo.jpeg">
  <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpeg">
  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}</style>
</head>
<body>
<h1 class="sr-only">Driver Login</h1>

<section class="track-page">
  <div class="track-card">
    <img src="../assets/images/logo.jpeg" style="width:110px;margin-bottom:15px;">

    <h2>Driver Login</h2>
    <p>Login to view assigned deliveries.</p>

    <input type="text" id="email" placeholder="Driver Email or Phone" style="padding:12px;width:90%;margin:10px;">
    <input type="password" id="password" placeholder="Password" style="padding:12px;width:90%;margin:10px;">

    <button onclick="driverLogin()" style="background:#d9b431;color:#071b33;padding:12px 25px;border:none;border-radius:8px;font-weight:bold;">
      Login
    </button>

    <p style="margin:8px 0 0;"><a href="#" onclick="event.preventDefault();forgotPassword()">Forgot Password?</a></p>
    <p id="message" style="margin-top:15px;font-weight:bold;"></p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/.netlify/functions/public-supabase-config"></script>

<script>
const supabaseUrl = "" + (window.CAQ_SUPABASE_URL || "") + "";
  const supabaseKey = "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

async function driverLogin() {
  const emailOrPhone = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const message = document.getElementById("message");

  if (!emailOrPhone || !password) {
    message.innerText = "Enter email/phone and password.";
    message.style.color = "red";
    return;
  }

  let loginEmail = emailOrPhone.toLowerCase();

  if(!emailOrPhone.includes("@")){
    const lookup = await supabaseClient
      .from("drivers")
      .select("email")
      .eq("phone", emailOrPhone)
      .limit(1)
      .maybeSingle();

    if(!lookup.error && lookup.data && lookup.data.email){
      loginEmail = String(lookup.data.email).toLowerCase();
    }
  }

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: loginEmail,
    password
  });

  if(error){
    message.innerText = "Invalid login.";
    message.style.color = "red";
    return;
  }

  const driverResult = await supabaseClient
    .from("drivers")
    .select("*")
    .eq("email", loginEmail)
    .limit(1)
    .maybeSingle();

  if(driverResult.error || !driverResult.data){
    await supabaseClient.auth.signOut();
    message.innerText = "Driver profile not found.";
    message.style.color = "red";
    return;
  }

  const driver = driverResult.data;

  if(driver.account_status === "Suspended" || driver.is_active === false){
    await supabaseClient.auth.signOut();
    message.innerText = "This account is suspended. Contact dispatch.";
    message.style.color = "red";
    return;
  }

  if(driver.force_password_reset){
    await supabaseClient.auth.resetPasswordForEmail(loginEmail, {
      redirectTo: `${window.location.origin}/driver/reset-password.html`
    });
    await supabaseClient.auth.signOut();
    message.innerText = "Password reset required. Check your email for a secure reset link.";
    message.style.color = "#0b2d52";
    return;
  }

  await supabaseClient
    .from("drivers")
    .update({
      auth_user_id: (await supabaseClient.auth.getUser()).data.user?.id || driver.auth_user_id || null,
      last_login_at: new Date().toISOString(),
      account_status: "Active",
      activated_at: driver.activated_at || new Date().toISOString()
    })
    .eq("id", driver.id);

  localStorage.setItem("driver_id", driver.id);
  localStorage.setItem("driver_name", driver.name || "Driver");
  localStorage.setItem("role", "driver");
  localStorage.setItem("driver_auth_user_id", driver.auth_user_id || "");

  window.location.href = "/driver/dashboard.html";
}

async function forgotPassword(){
  const message = document.getElementById("message");
  const emailOrPhone = document.getElementById("email").value.trim();

  if(!emailOrPhone){
    message.innerText = "Enter your email (or phone) first.";
    message.style.color = "red";
    return;
  }

  let email = emailOrPhone.toLowerCase();

  if(!emailOrPhone.includes("@")){
    const lookup = await supabaseClient
      .from("drivers")
      .select("email")
      .eq("phone", emailOrPhone)
      .limit(1)
      .maybeSingle();

    if(!lookup.error && lookup.data && lookup.data.email){
      email = String(lookup.data.email).toLowerCase();
    }
  }

  await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: `${window.location.origin}/driver/reset-password.html`
  });

  message.innerText = "If an account exists, a password reset email has been sent.";
  message.style.color = "#0b2d52";
}
</script>

</body>
</html>
