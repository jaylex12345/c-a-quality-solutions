    body{background:#eef2f7;color:#071b33;font-family:Arial,sans-serif}
    .driver-shell{min-height:100vh;display:grid;place-items:center;padding:18px}
    .driver-card{width:min(100%,460px);background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 28px rgba(0,0,0,.12);border:1px solid #d7e0ee}

    .driver-brand img{width:72px;height:72px;border-radius:18px;object-fit:cover;border:1px solid #d7e0ee}
    .driver-brand h2{margin:0;font-size:28px;line-height:1.1}
    .driver-brand p{margin:4px 0 0;color:#5b6779}
    .driver-card input{width:100%;padding:14px 14px;border:1px solid #cbd5e1;border-radius:12px;margin-top:12px;font-size:16px}
    .driver-card button{width:100%;margin-top:14px;background:#d9b431;color:#071b33;padding:14px 18px;border:none;border-radius:12px;font-weight:bold;font-size:16px;min-height:48px}
    .helper-row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}

<body>
<h1 class="sr-only">Driver Login</h1>

<section class="driver-shell">
  <div class="driver-card">
    <div class="driver-brand">
      <img src="../assets/images/logo.jpeg" alt="C&A Quality Solutions logo">
      <div>
        <h2>C&amp;A Driver</h2>
        <p>Driver login for assigned work, GPS, and proof uploads.</p>
      </div>
    </div>

    <input type="text" id="email" placeholder="Driver Email or Phone" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">

    <button onclick="driverLogin()">Login</button>

    <div class="helper-row">
      <a href="#" onclick="event.preventDefault();forgotPassword()">Forgot Password?</a>
      <a href="/driver/install.html">Install instructions</a>
    </div>

    <div class="install-note">
      <strong>Install the app</strong>
      On iPhone or Android, open the install page after login to add C&amp;A Driver to your home screen.
    </div>

    <p id="message" style="margin-top:15px;font-weight:bold;"></p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/.netlify/functions/public-supabase-config"></script>

<script>
const supabaseUrl = "" + (window.CAQ_SUPABASE_URL || "") + "";
  const supabaseKey = "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").catch(() => {});
  });
}

async function driverLogin() {
  const emailOrPhone = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const message = document.getElementById("message");

  if (!emailOrPhone || !password) {
    message.innerText = "Enter email/phone and password.";
    message.style.color = "red";
    return;
  }

  let loginEmail = emailOrPhone.toLowerCase();

  if(!emailOrPhone.includes("@")){
    const lookup = await supabaseClient
      .from("drivers")
      .select("email")
      .eq("phone", emailOrPhone)
      .limit(1)
      .maybeSingle();

    if(!lookup.error && lookup.data && lookup.data.email){
      loginEmail = String(lookup.data.email).toLowerCase();
    }
  }

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: loginEmail,
    password
  });

  if(error){
    message.innerText = "Invalid login.";
    message.style.color = "red";
    return;
  }

  const driverResult = await supabaseClient
    .from("drivers")
    .select("*")
    .eq("email", loginEmail)
    .limit(1)
    .maybeSingle();

  if(driverResult.error || !driverResult.data){
    await supabaseClient.auth.signOut();
    message.innerText = "Driver profile not found.";
    message.style.color = "red";
    return;
  }

  const driver = driverResult.data;

  if(driver.account_status === "Suspended" || driver.is_active === false){
    await supabaseClient.auth.signOut();
    message.innerText = "This account is suspended. Contact dispatch.";
    message.style.color = "red";
    return;
  }

  if(driver.force_password_reset){
    await supabaseClient.auth.resetPasswordForEmail(loginEmail, {
      redirectTo: `${window.location.origin}/driver/reset-password.html`
    });
    await supabaseClient.auth.signOut();
    message.innerText = "Password reset required. Check your email for a secure reset link.";
    message.style.color = "#0b2d52";
    return;
  }

  await supabaseClient
    .from("drivers")
    .update({
      auth_user_id: (await supabaseClient.auth.getUser()).data.user?.id || driver.auth_user_id || null,
      last_login_at: new Date().toISOString(),
      account_status: "Active",
      activated_at: driver.activated_at || new Date().toISOString()
    })
    .eq("id", driver.id);

  localStorage.setItem("driver_id", driver.id);
  localStorage.setItem("driver_name", driver.name || "Driver");
  localStorage.setItem("role", "driver");
  localStorage.setItem("driver_auth_user_id", driver.auth_user_id || "");

  window.location.href = "/driver/dashboard.html";
}

async function forgotPassword(){
  const message = document.getElementById("message");
  const emailOrPhone = document.getElementById("email").value.trim();

  if(!emailOrPhone){
    message.innerText = "Enter your email (or phone) first.";
    message.style.color = "red";
    return;
  }

  let email = emailOrPhone.toLowerCase();

  if(!emailOrPhone.includes("@")){
    const lookup = await supabaseClient
      .from("drivers")
      .select("email")
      .eq("phone", emailOrPhone)
      .limit(1)
      .maybeSingle();

    if(!lookup.error && lookup.data && lookup.data.email){
      email = String(lookup.data.email).toLowerCase();
    }
  }

  await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: `${window.location.origin}/driver/reset-password.html`
  });

  message.innerText = "If an account exists, a password reset email has been sent.";
  message.style.color = "#0b2d52";
}
</script>

</body>
</html>
