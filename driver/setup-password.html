<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Password | C&A Quality Solutions LLC</title>
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/.netlify/functions/public-supabase-config"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#071b33;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:#fff;max-width:560px;width:100%;padding:28px;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.08)}
h1{margin-top:0}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin:8px 0}
button{background:#d9b431;color:#071b33;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer;width:100%}
.req{font-size:14px;color:#475569}
.ok{color:#166534;font-weight:bold}
.err{color:#991b1b;font-weight:bold}
</style>
</head>
<body>
  <main class="card">
    <h1>Welcome to C&A Quality Solutions.</h1>
    <p>Please create your password to activate your account.</p>
    <input id="newPassword" type="password" placeholder="New Password">
    <input id="confirmPassword" type="password" placeholder="Confirm Password">
    <p class="req">Password must be at least 8 characters and include uppercase, lowercase, number, and special character.</p>
    <button onclick="savePassword()">Save Password</button>
    <p id="message"></p>
  </main>

<script>
const supabaseUrl = "" + (window.CAQ_SUPABASE_URL || "") + "";
const supabaseKey = "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

function validPassword(value){
  return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}$/.test(value || "");
}

async function ensureSession(){
  const { data } = await supabaseClient.auth.getSession();
  if(data.session) return data.session;

  return new Promise(resolve => {
    const sub = supabaseClient.auth.onAuthStateChange((_event, session) => {
      if(session){
        sub.data.subscription.unsubscribe();
        resolve(session);
      }
    });

    setTimeout(() => {
      sub.data.subscription.unsubscribe();
      resolve(null);
    }, 3000);
  });
}

async function savePassword(){
  const message = document.getElementById("message");
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if(!validPassword(newPassword)){
    message.className = "err";
    message.innerText = "Password does not meet requirements.";
    return;
  }

  if(newPassword !== confirmPassword){
    message.className = "err";
    message.innerText = "Passwords do not match.";
    return;
  }

  const session = await ensureSession();
  if(!session){
    message.className = "err";
    message.innerText = "This setup link is invalid or expired. Ask dispatch for a new invitation email.";
    return;
  }

  const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
  if(error){
    message.className = "err";
    message.innerText = error.message;
    return;
  }

  const authUser = (await supabaseClient.auth.getUser()).data.user;
  const nowIso = new Date().toISOString();
  let driver = null;

  if(authUser?.id){
    const byUserId = await supabaseClient
      .from("drivers")
      .select("*")
      .eq("auth_user_id", authUser.id)
      .limit(1)
      .maybeSingle();
    if(byUserId.data) driver = byUserId.data;
  }

  if(!driver && authUser?.email){
    const byEmail = await supabaseClient
      .from("drivers")
      .select("*")
      .eq("email", authUser.email)
      .limit(1)
      .maybeSingle();
    if(byEmail.data) driver = byEmail.data;
  }

  if(driver){
    await supabaseClient
      .from("drivers")
      .update({
        auth_user_id: authUser?.id || driver.auth_user_id || null,
        account_status: "Active",
        activated_at: nowIso,
        is_active: true,
        status: "Active",
        force_password_reset: false,
        last_login_at: nowIso
      })
      .eq("id", driver.id);

    localStorage.setItem("driver_id", driver.id);
    localStorage.setItem("driver_name", driver.name || "Driver");
    localStorage.setItem("role", "driver");
    localStorage.setItem("driver_auth_user_id", authUser?.id || "");
  }

  message.className = "ok";
  message.innerText = "Password set successfully. Redirecting to dashboard...";
  setTimeout(() => {
    window.location.href = "/driver/dashboard.html";
  }, 800);
}
</script>
</body>
</html>
