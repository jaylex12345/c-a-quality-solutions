<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | C&A Quality Solutions LLC</title>
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/.netlify/functions/public-supabase-config"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#071b33;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:#fff;max-width:560px;width:100%;padding:28px;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.08)}
h1{margin-top:0}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin:8px 0}
button{background:#d9b431;color:#071b33;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer;width:100%}
.req{font-size:14px;color:#475569}
.ok{color:#166534;font-weight:bold}
.err{color:#991b1b;font-weight:bold}
</style>
</head>
<body>
  <main class="card">
    <h1>Reset Your Password</h1>
    <p>Enter your new secure password.</p>
    <input id="newPassword" type="password" placeholder="New Password">
    <input id="confirmPassword" type="password" placeholder="Confirm Password">
    <p class="req">Password must be at least 8 characters and include uppercase, lowercase, number, and special character.</p>
    <button onclick="savePassword()">Update Password</button>
    <p id="message"></p>
  </main>

<script>
const supabaseUrl = "" + (window.CAQ_SUPABASE_URL || "") + "";
const supabaseKey = "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

function validPassword(value){
  return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}$/.test(value || "");
}

async function hydrateSessionFromTokenHash(){
  const params = new URLSearchParams(window.location.search || "");
  const tokenHash = params.get("token_hash");
  const typeParam = params.get("type");
  const type = typeParam === "invite" ? "invite" : "recovery";

  if(!tokenHash) return null;

  const result = await supabaseClient.auth.verifyOtp({
    type,
    token_hash: tokenHash
  });

  return result.error ? null : result.data?.session || null;
}

async function ensureSession(){
  const hydrated = await hydrateSessionFromTokenHash();
  if(hydrated) return hydrated;

  const { data } = await supabaseClient.auth.getSession();
  if(data.session) return data.session;

  return new Promise(resolve => {
    const sub = supabaseClient.auth.onAuthStateChange((_event, session) => {
      if(session){
        sub.data.subscription.unsubscribe();
        resolve(session);
      }
    });

    setTimeout(() => {
      sub.data.subscription.unsubscribe();
      resolve(null);
    }, 3000);
  });
}

async function savePassword(){
  const message = document.getElementById("message");
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if(!validPassword(newPassword)){
    message.className = "err";
    message.innerText = "Password does not meet requirements.";
    return;
  }

  if(newPassword !== confirmPassword){
    message.className = "err";
    message.innerText = "Passwords do not match.";
    return;
  }

  const session = await ensureSession();
  if(!session){
    message.className = "err";
    message.innerText = "This reset link is invalid or expired. Request another reset email.";
    return;
  }

  const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
  if(error){
    message.className = "err";
    message.innerText = error.message;
    return;
  }

  const authUser = (await supabaseClient.auth.getUser()).data.user;
  const nowIso = new Date().toISOString();
  if(authUser?.email){
    await supabaseClient
      .from("drivers")
      .update({
        force_password_reset: false,
        account_status: "Active",
        activated_at: nowIso,
        last_login_at: nowIso
      })
      .eq("email", authUser.email);
  }

  message.className = "ok";
  message.innerText = "Password updated. Redirecting to login...";
  await supabaseClient.auth.signOut();
  setTimeout(() => {
    window.location.href = "/driver/login.html";
  }, 900);
}
</script>
</body>
</html>
