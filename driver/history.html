<body>
  <main style="max-width:900px;margin:40px auto;padding:20px;">
    <h1>Driver History</h1>
    <p>Completed delivery history will appear here.</p>
    <p><a href="/driver/dashboard.html">Back to Dashboard</a></p>
  </main>

<script>
const supabaseUrl = "" + (window.CAQ_SUPABASE_URL || "") + "";
const supabaseKey = "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

async function requireDriverSession(){
  const sessionResult = await supabaseClient.auth.getSession();
  const session = sessionResult && sessionResult.data ? sessionResult.data.session : null;
  if(!session || !session.user){
    window.location.replace("/driver/login.html");
    return null;
  }

  const user = session.user;
  let driverResult = await supabaseClient
    .from("drivers")
    .select("id,name,is_active,account_status,email")
    .eq("auth_user_id", user.id)
    .limit(1)
    .maybeSingle();

  if(!driverResult.data && user.email){
    driverResult = await supabaseClient
      .from("drivers")
      .select("id,name,is_active,account_status,email")
      .eq("email", user.email)
      .limit(1)
      .maybeSingle();
  }

  const driver = driverResult && driverResult.data ? driverResult.data : null;
  if(!driver || driver.is_active === false || driver.account_status === "Suspended"){
    await supabaseClient.auth.signOut();
    window.location.replace("/driver/login.html");
    return null;
  }

  localStorage.setItem("driver_id", driver.id);
  localStorage.setItem("driver_name", driver.name || "Driver");
  localStorage.setItem("role", "driver");
  return driver;
}

requireDriverSession();
</script>
