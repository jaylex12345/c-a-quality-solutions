<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Package | C&A Quality Solutions LLC</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
.track-page{min-height:80vh;background:#f4f7fb;padding:60px 20px;text-align:center}
.track-card{max-width:650px;margin:auto;background:white;padding:35px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.track-card h2{color:#0b2d52;font-size:34px;margin-bottom:10px}
.track-card p{color:#555}
.track-form{display:flex;gap:10px;justify-content:center;margin:25px 0}
.track-form input{padding:15px;width:65%;border:1px solid #ccc;border-radius:8px;font-size:16px}
.track-form button{background:#d9b431;color:#071b33;border:none;padding:15px 22px;border-radius:8px;font-weight:bold;cursor:pointer}
.result-box{margin-top:25px;padding:25px;border-radius:14px;background:#eef5ff;border-left:6px solid #0b2d52}
.status{display:inline-block;background:#19a84a;color:white;padding:8px 16px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>

<header class="site-header">
    <div class="nav-container">
        <h1>C&A Quality Solutions LLC</h1>
    </div>
</header>

<section class="track-page">
  <div class="track-card">
  <img src="images/logo.jpeg" alt="C&A Quality Solutions Logo" style="width:110px;margin-bottom:15px;">
  <h2>Package Tracking</h2>
    <p>Enter your C&A Quality Solutions tracking number to view delivery status and proof of delivery.</p>

    <div class="track-form">
      <input type="text" id="trackingNumber" placeholder="Enter Tracking Number">
      <button onclick="trackPackage()">Track Package</button>
    </div>

    <div id="result"></div>
  </div>
  <div style="margin-top:25px;font-weight:bold;color:#0b2d52;">
  Licensed • Insured • Bonded<br>
  Maryland • DC • Virginia<br>
  Same-Day Courier Service
</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://ncdozhypelmkvaxsdwwt.supabase.co";
const supabaseKey = "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR";

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

async function trackPackage() {
    const tracking = document.getElementById("trackingNumber").value.trim();
    console.log("Searching for:", tracking);
    const result = document.getElementById("result");

    if (!tracking) {
        result.innerHTML = "<p>Please enter a tracking number.</p>";
        return;
    }

    const { data, error } = await supabaseClient
  .from("deliveries")
  .select("*")
  .ilike("tracking_number", tracking)
  .maybeSingle();

  console.log("Data:", data);
console.log("Error:", error);

    if (error) {
    result.innerHTML = `<p>Error: ${error.message}</p>`;
    console.log(error);
    return;
}

if (!data) {
    result.innerHTML = "<p>No delivery found with that tracking number.</p>";
    return;
}

    result.innerHTML = `
  <div class="result-box">
    <h3>Tracking Number: ${data.tracking_number}</h3>
    <p><strong>Customer:</strong> ${data.customer_name || "N/A"}</p>

    <p class="progress">
      🟢 Picked Up → 🟢 In Transit → ⚪ Out for Delivery → ⚪ Delivered
    </p>

    <p><strong>Status:</strong> <span class="status">${data.status || "Pending"}</span></p>

    <div style="margin-top:15px;padding:12px;background:#fff;border-radius:8px;">
  <strong>Need Help?</strong><br>
  📞 410-878-5949<br>
  ✉️ james@caqualitysolutions.com
</div>

    ${
      data.proof_of_delivery
        ? `<p><a href="${data.proof_of_delivery}" target="_blank">View Proof of Delivery</a></p>`
        : `<p><em>Proof of delivery not uploaded yet.</em></p>`
    }
  </div>
`;
}
</script>

<footer style="margin-top:40px;text-align:center;color:#666;">
  © 2026 C&A Quality Solutions LLC<br>
  Licensed Courier & Medical Delivery Services
</footer>
</body>
</html>
