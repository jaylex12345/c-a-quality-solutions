<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#071b33}
.wrap{max-width:800px;margin:40px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 8px 20px rgba(0,0,0,.08);text-align:center}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px}
button{margin-top:12px;background:#d9b431;color:#071b33;border:0;padding:12px 16px;border-radius:8px;font-weight:bold;cursor:pointer}
.result{margin-top:18px;text-align:left;background:#eef5ff;border-radius:12px;padding:14px}
.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:bold}
.proof{max-width:100%;border-radius:10px;margin-top:10px}
</style>

</head>
<body>
<div class="wrap">
	<div class="card">
		<h1>Legacy URL Redirect Page: track</h1>
		<input id="tracking" placeholder="Enter tracking number">
		<button onclick="trackPackage()">Track</button>
		<div id="result"></div>
	</div>
</div>
<script>
const supabaseClient = supabase.createClient("https://ncdozhypelmkvaxsdwwt.supabase.co", "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR");

async function trackPackage(){
	const tracking = document.getElementById("tracking").value.trim();
	if(!tracking) return;
	const { data, error } = await supabaseClient.from("deliveries").select("*").eq("tracking_number", tracking).limit(1);
	if(error){ document.getElementById("result").innerHTML = `<div class="result">${error.message}</div>`; return; }
	if(!data || !data.length){ document.getElementById("result").innerHTML = '<div class="result">No delivery found.</div>'; return; }
	const d = data[0];
	const dropoff = d.delivery_address || d.delivery_location || d.dropoff_address || d.destination_address || '';
	const proofUrl = d.proof_photo_url || d.proof_of_delivery || '';
	document.getElementById("result").innerHTML = `
		<div class="result">
			<p><strong>Tracking:</strong> ${d.tracking_number || ''}</p>
			<p><strong>Customer:</strong> ${d.customer_name || ''}</p>
			<p><strong>Status:</strong> <span class="status">${d.status || 'Pending'}</span></p>
			<p><strong>Pickup:</strong> ${d.pickup_address || ''}</p>
			<p><strong>Drop-off:</strong> ${dropoff}</p>
			<p><strong>Delivered:</strong> ${d.delivery_time ? new Date(d.delivery_time).toLocaleString() : 'Pending'}</p>
			${proofUrl ? `<img class="proof" src="${proofUrl}" alt="Proof of delivery">` : '<p>No proof uploaded yet.</p>'}
		</div>`;
}
</script>
</body>
</html>
