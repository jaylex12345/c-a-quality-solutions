<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Package | C&A Quality Solutions LLC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <div class="nav-container">
        <h1>C&A Quality Solutions LLC</h1>
    </div>
</header>

<section style="padding:50px; text-align:center;">
    <h2>Track Your Package</h2>

    <input
        type="text"
        id="trackingNumber"
        placeholder="Enter Tracking Number"
        style="padding:12px;width:300px;"
    >

    <button onclick="trackPackage()">
        Track Package
    </button>

    <div id="result" style="margin-top:30px;"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://ncdozhypelmkvaxsdwwt.supabase.co";
const supabaseKey = "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR";

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

async function trackPackage() {
    const tracking = document.getElementById("trackingNumber").value.trim();
    const result = document.getElementById("result");

    if (!tracking) {
        result.innerHTML = "<p>Please enter a tracking number.</p>";
        return;
    }

    const { data, error } = await supabaseClient
        .from("deliveries")
        .select("*")
        .eq("tracking_number", tracking)
        .single();

    if (error) {
    result.innerHTML = `<p>Error: ${error.message}</p>`;
    console.log(error);
    return;
}

if (!data) {
    result.innerHTML = "<p>No delivery found with that tracking number.</p>";
    return;
}

    result.innerHTML = `
        <h3>Tracking Number: ${data.tracking_number}</h3>
        <p><strong>Customer:</strong> ${data.customer_name || "N/A"}</p>
        <p><strong>Status:</strong> ${data.status || "Pending"}</p>
        ${data.proof_of_delivery ? `<p><a href="${data.proof_of_delivery}" target="_blank">View Proof of Delivery</a></p>` : ""}
    `;
}
</script>

</body>
</html>
