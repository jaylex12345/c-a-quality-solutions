<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Profile | C&A Quality Solutions LLC</title>
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/.netlify/functions/public-supabase-config"></script>
  <meta name="description" content="Official customer profile page for C&A Quality Solutions LLC operations and customer support.">
  <link rel="canonical" href="https://caqualitysolutions.com/customer/profile.html">
  <meta name="robots" content="noindex, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Customer Profile | C&A Quality Solutions LLC">
  <meta property="og:description" content="Official customer profile page for C&A Quality Solutions LLC operations and customer support.">
  <meta property="og:url" content="https://caqualitysolutions.com/customer/profile.html">
  <meta property="og:image" content="https://caqualitysolutions.com/assets/images/logo.jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Customer Profile | C&A Quality Solutions LLC">
  <meta name="twitter:description" content="Official customer profile page for C&A Quality Solutions LLC operations and customer support.">
  <meta name="twitter:image" content="https://caqualitysolutions.com/assets/images/logo.jpeg">
  <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpeg">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#071b33}
    .header{background:linear-gradient(135deg,#061b3a,#0b2d52);color:#fff;padding:20px;text-align:center}
    .nav{background:#08213f;padding:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .nav a,.nav button{color:#fff;text-decoration:none;font-weight:bold;background:transparent;border:1px solid rgba(255,255,255,.35);padding:10px 14px;border-radius:10px;cursor:pointer}
    .container{max-width:980px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 8px 20px rgba(0,0,0,.08);margin-bottom:16px}
    label{display:block;margin:10px 0 6px;font-weight:bold}
    input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btn{background:#0b2d52;color:#fff;border:0;border-radius:10px;padding:12px 14px;font-weight:bold;cursor:pointer;min-height:48px}
    .muted{color:#64748b}
    .ok{color:#166534;font-weight:bold}
    .error{color:#991b1b;font-weight:bold}
    @media(max-width:720px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="header">
    <h1>Customer Profile</h1>
    <p>Manage account details used for booking and delivery updates</p>
  </div>
  <div class="nav">
    <a href="/customer-dashboard.html">Dashboard</a>
    <a href="/customer/invoices.html">Invoices</a>
    <a href="/customer/booking.html">Book Service</a>
    <a href="/customer/tracking.html">Track Package</a>
    <button onclick="logout()">Logout</button>
  </div>

  <main class="container">
    <section class="card">
      <h2>Account Overview</h2>
      <p class="muted" id="overviewText">Loading customer profile...</p>
    </section>

    <section class="card">
      <h2>Profile Details</h2>
      <div class="row">
        <div>
          <label for="business_name">Business or Customer Name</label>
          <input id="business_name" placeholder="Customer Name">
        </div>
        <div>
          <label for="contact_person">Primary Contact</label>
          <input id="contact_person" placeholder="Contact Person">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="phone">Phone</label>
          <input id="phone" placeholder="Phone Number">
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" placeholder="Email Address" disabled>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="address">Address</label>
          <input id="address" placeholder="Street Address">
        </div>
        <div>
          <label for="city">City / Region</label>
          <input id="city" placeholder="City / Region">
        </div>
      </div>
      <button class="btn" onclick="saveProfile()">Save Profile</button>
      <p id="statusMsg"></p>
    </section>
  </main>

<script>
const supabaseUrl = "" + (window.CAQ_SUPABASE_URL || "") + "";
const supabaseKey='sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR';
const supabaseClient=supabase.createClient(supabaseUrl,supabaseKey);

const role=localStorage.getItem('role');
const customerId=localStorage.getItem('customer_id');
const customerEmail=localStorage.getItem('customer_email');
let profileRow = null;

if(role !== 'customer' || !customerEmail){
  window.location.href='/customer-login.html';
}

function logout(){
  localStorage.removeItem('customer_id');
  localStorage.removeItem('customer_email');
  localStorage.removeItem('customer_name');
  localStorage.removeItem('role');
  window.location.href='/customer-login.html';
}

function setMessage(text, type){
  const box = document.getElementById('statusMsg');
  box.className = type === 'error' ? 'error' : 'ok';
  box.innerText = text;
}

function field(id){
  return document.getElementById(id);
}

async function loadProfile(){
  let query = supabaseClient.from('customers').select('*').eq('email', customerEmail).limit(1);
  if(customerId) query = supabaseClient.from('customers').select('*').eq('id', customerId).limit(1);

  const { data, error } = await query;
  if(error || !data || !data.length){
    document.getElementById('overviewText').innerText = error ? error.message : 'No customer profile found.';
    return;
  }

  profileRow = data[0];

  field('business_name').value = profileRow.business_name || '';
  field('contact_person').value = profileRow.contact_person || '';
  field('phone').value = profileRow.phone || '';
  field('email').value = profileRow.email || customerEmail;
  field('address').value = profileRow.address || profileRow.street || '';
  field('city').value = profileRow.city || profileRow.state || '';

  localStorage.setItem('customer_id', profileRow.id);
  localStorage.setItem('customer_name', profileRow.contact_person || profileRow.business_name || 'Customer');

  document.getElementById('overviewText').innerText = `${profileRow.contact_person || profileRow.business_name || 'Customer'} | ${profileRow.email || ''} | ${profileRow.phone || 'No phone on file'}`;
}

async function saveProfile(){
  if(!profileRow){
    setMessage('Profile not loaded yet.', 'error');
    return;
  }

  const payload = {
    business_name: field('business_name').value.trim(),
    contact_person: field('contact_person').value.trim(),
    phone: field('phone').value.trim(),
    address: field('address').value.trim(),
    city: field('city').value.trim()
  };

  const { error } = await supabaseClient
    .from('customers')
    .update(payload)
    .eq('id', profileRow.id)
    .eq('email', profileRow.email || customerEmail);

  if(error){
    setMessage(error.message, 'error');
    return;
  }

  localStorage.setItem('customer_name', payload.contact_person || payload.business_name || 'Customer');
  setMessage('Profile updated successfully.', 'ok');
  loadProfile();
}

loadProfile();
</script>
</body>
</html>
