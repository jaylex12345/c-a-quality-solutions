<body>
<header>
  <h1>Book Your Courier Delivery</h1>
  <p>Professional Courier & Transportation Booking</p>
  <nav>
    <a href="/">Home</a>
    <a href="/services.html">Services</a>
    <a href="/pricing.html">Pricing</a>
    <a href="/about.html">About Us</a>
    <a href="/contact.html">Contact</a>
    <a class="book" href="/customer/booking.html">Request Quote / Book</a>
  </nav>
</header>

<div class="container">
  <div class="card">
    <h2>Request a Quote / Book Service</h2>

    <form id="bookingForm">
      <label>Full Name</label>
      <input id="customerName" type="text" required>

      <label>Phone Number</label>
      <input id="customerPhone" type="text" required>

      <label>Email Address</label>
      <input type="email" id="customerEmail" required>

      <label>Service Type</label>
      <select id="serviceType" required>
        <option>Standard Courier</option>
        <option>Priority / Same-Day Delivery</option>
        <option>Medical Courier</option>
        <option>Legal Courier</option>
        <option>Property Services</option>
        <option>Dedicated Route / Monthly Contract</option>
      </select>

      <label>Pickup Address</label>
      <input type="text" id="pickup_address" required>

      <label>Drop-off Address</label>
      <input type="text" id="dropoff_address" required>

      <input type="hidden" id="estimatedMiles">
      <div id="milesText" class="meta">Estimated Miles: --</div>

      <label>Pickup Date</label>
      <input type="date" id="pickupDate" required>

      <label>Special Instructions</label>
      <textarea id="instructions"></textarea>

      <div id="result" class="price-box">Estimated Price: $0.00</div>
      <p id="msg"></p>

      <button type="submit">Submit Booking</button>
    </form>
  </div>
</div>

<footer class="footer">
  <p>© 2026 C&A Quality Solutions LLC. All Rights Reserved.</p>
</footer>

<script>
const supabaseClient = supabase.createClient("https://ncdozhypelmkvaxsdwwt.supabase.co", "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR");
let pickupAutocomplete;
let dropoffAutocomplete;
let distanceService;
let latestMiles = 0;

function initAutocomplete(){
  pickupAutocomplete = new google.maps.places.Autocomplete(document.getElementById("pickup_address"));
  dropoffAutocomplete = new google.maps.places.Autocomplete(document.getElementById("dropoff_address"));
  distanceService = new google.maps.DistanceMatrixService();
  pickupAutocomplete.addListener("place_changed", calculateAutoMiles);
  dropoffAutocomplete.addListener("place_changed", calculateAutoMiles);
}

function servicePricing(type){
  if(type === "Priority / Same-Day Delivery") return { base: 70, mile: 2.5 };
  if(type === "Medical Courier") return { base: 75, mile: 2.5 };
  if(type === "Legal Courier") return { base: 65, mile: 2.25 };
  if(type === "Property Services") return { base: 65, mile: 2.25 };
  return { base: 45, mile: 2.25 };
}

function updatePrice(){
  if(!latestMiles){
    document.getElementById("result").innerText = "Estimated Price: $0.00";
    return;
  }
  const rate = servicePricing(document.getElementById("serviceType").value);
  const price = rate.base + (latestMiles * rate.mile);
  document.getElementById("result").innerText = `Estimated Price: $${price.toFixed(2)}`;
}

function calculateAutoMiles(){
  const pickup = document.getElementById("pickup_address").value.trim();
  const dropoff = document.getElementById("dropoff_address").value.trim();
  if(!pickup || !dropoff || !distanceService) return;

  distanceService.getDistanceMatrix({
    origins:[pickup],
    destinations:[dropoff],
    travelMode: google.maps.TravelMode.DRIVING,
    unitSystem: google.maps.UnitSystem.IMPERIAL
  }, (response, status) => {
    if(status !== "OK") return;
    const element = response.rows[0].elements[0];
    if(!element || element.status !== "OK") return;
    latestMiles = Number((element.distance.value / 1609.344).toFixed(1));
    document.getElementById("estimatedMiles").value = String(latestMiles);
    document.getElementById("milesText").innerText = `Estimated Miles: ${latestMiles}`;
    updatePrice();
  });
}

document.getElementById("serviceType").addEventListener("change", updatePrice);

function trackingNumber(){
  const seed = Date.now().toString().slice(-6);
  return `CAQ-${seed}-${Math.floor(Math.random()*900+100)}`;
}

async function upsertCustomer(){
  const email = document.getElementById("customerEmail").value.trim();
  const customerPayload = {
    business_name: document.getElementById("customerName").value.trim(),
    contact_person: document.getElementById("customerName").value.trim(),
    phone: document.getElementById("customerPhone").value.trim(),
    email,
    password: email,
    address: document.getElementById("pickup_address").value.trim(),
    billing_address: document.getElementById("pickup_address").value.trim(),
    account_status: "Active"
  };

  const { data: existing } = await supabaseClient.from("customers").select("id").eq("email", email).limit(1);
  if(existing && existing.length){
    const { error } = await supabaseClient.from("customers").update(customerPayload).eq("id", existing[0].id);
    if(error) throw error;
    return existing[0].id;
  }

  const { data, error } = await supabaseClient.from("customers").insert([customerPayload]).select("id").single();
  if(error) throw error;
  return data.id;
}

document.getElementById("bookingForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if(!latestMiles){
    document.getElementById("msg").innerText = "Select pickup and drop-off addresses to calculate miles automatically.";
    return;
  }

  try{
    const submitBtn = document.querySelector("#bookingForm button[type='submit']");
    if(submitBtn){
      submitBtn.disabled = true;
      submitBtn.innerText = "Redirecting to Checkout...";
    }

    const customerId = await upsertCustomer();
    const rate = servicePricing(document.getElementById("serviceType").value);
    const estimatedPrice = rate.base + (latestMiles * rate.mile);
    const tracking = trackingNumber();

    const checkoutPayload = {
      amount: Number(estimatedPrice.toFixed(2)),
      email: document.getElementById("customerEmail").value.trim(),
      customerName: document.getElementById("customerName").value.trim(),
      customerPhone: document.getElementById("customerPhone").value.trim(),
      serviceType: document.getElementById("serviceType").value,
      pickup: document.getElementById("pickup_address").value.trim(),
      dropoff: document.getElementById("dropoff_address").value.trim(),
      pickupDate: document.getElementById("pickupDate").value,
      pickupTime: "",
      instructions: document.getElementById("instructions").value.trim(),
      estimatedMiles: latestMiles,
      trackingNumber: tracking,
      customerId
    };

    const response = await fetch("/.netlify/functions/create-checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(checkoutPayload)
    });

    const checkout = await response.json();
    if(!response.ok || !checkout.url){
      throw new Error(checkout.error || "Unable to start checkout");
    }

    document.getElementById("msg").innerText = `Redirecting to secure payment. Tracking: ${tracking}`;
    window.location.href = checkout.url;
  }catch(error){
    document.getElementById("msg").innerText = error.message;
    const submitBtn = document.querySelector("#bookingForm button[type='submit']");
    if(submitBtn){
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Booking";
    }
  }
});
</script>
</body>
