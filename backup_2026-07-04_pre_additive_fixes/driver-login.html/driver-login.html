<body>
<h1 class="sr-only">Driver login redirect</h1>
<div class="card">
	<h2>Driver Login</h2>
	<input id="email" placeholder="Driver Email">
	<input id="password" type="password" placeholder="Password">
	<button onclick="driverLogin()">Login</button>
	<p id="message"></p>
</div>
<script>
const supabaseClient = supabase.createClient("" + (window.CAQ_SUPABASE_URL || "") + "", "sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR");
async function driverLogin(){
	const email = document.getElementById("email").value.trim();
	const password = document.getElementById("password").value.trim();
	const { data, error } = await supabaseClient.from("drivers").select("*").eq("email", email).eq("password", password).limit(1);
	if(error || !data || !data.length){ document.getElementById("message").innerText = "Invalid credentials."; return; }
	const driver = data[0];
	localStorage.setItem("driver_id", driver.id);
	localStorage.setItem("driver_name", driver.name || "Driver");
	localStorage.setItem("role", "driver");
	window.location.href = "driver-dashboard.html";
}
</script>
