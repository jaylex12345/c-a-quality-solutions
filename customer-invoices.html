<body>
<div class="header"><h1>Legacy URL Redirect Page: customer invoices</h1></div>
<div class="nav"><a href="customer-dashboard.html">Dashboard</a><a href="customer-profile.html">Profile</a><a href="customer-invoices.html">Invoices</a><a href="booking.html">Booking</a><a href="track.html">Tracking</a></div>
<div class="container">
  <div class="card">
    <table>
      <thead><tr><th>Invoice #</th><th>Amount</th><th>Due Date</th><th>Status</th><th>Deliveries</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
  </div>
</div>
<script>
const supabaseUrl='https://ncdozhypelmkvaxsdwwt.supabase.co';
const supabaseKey='sb_publishable_2PBI8u5Ja8mptMnFndFgNg_OCdabfqR';
const supabaseClient=supabase.createClient(supabaseUrl,supabaseKey);
const customerId=localStorage.getItem('customer_id');
const customerEmail=localStorage.getItem('customer_email');
const customerName=localStorage.getItem('customer_name');
if(!customerEmail){window.location.href='customer-login.html';}

function badge(status){
  if(status==='Paid') return '<span class="badge paid">Paid</span>';
  if(status==='Sent') return '<span class="badge sent">Sent</span>';
  return '<span class="badge pending">Pending</span>';
}

async function loadInvoices(){
  const [byEmail, byName, byCustomerId] = await Promise.all([
    supabaseClient.from('invoices').select('*').eq('customer_email', customerEmail),
    supabaseClient.from('invoices').select('*').eq('customer_name', customerName || ''),
    customerId ? supabaseClient.from('invoices').select('*').eq('customer_id', customerId) : Promise.resolve({ data: [], error: null })
  ]);
  const error = byEmail.error || byName.error || byCustomerId.error;
  if(error){document.getElementById('rows').innerHTML=`<tr><td colspan="5">${error.message}</td></tr>`;return;}

  const map = new Map();
  (byEmail.data || []).concat(byName.data || [], byCustomerId.data || []).forEach(item => map.set(String(item.id), item));
  const rows = Array.from(map.values()).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  if(!rows.length){document.getElementById('rows').innerHTML='<tr><td colspan="5">No invoices found.</td></tr>';return;}
  document.getElementById('rows').innerHTML=rows.map(i=>`<tr><td>${i.invoice_number||''}</td><td>$${Number(i.amount||0).toFixed(2)}</td><td>${i.due_date?new Date(i.due_date).toLocaleDateString():''}</td><td>${badge(i.status)}</td><td>${Array.isArray(i.delivery_ids)?i.delivery_ids.join(', '):(i.delivery_ids||'')}</td></tr>`).join('');
}

loadInvoices();
</script>
